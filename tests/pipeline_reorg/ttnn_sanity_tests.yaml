- name: "kernel lib tests"
  # The device-perf tests in this directory shell out to `python3 -m tracy`, which needs a
  # Tracy-enabled build; this job runs from the wheel, so they fail on a missing profiler
  # rather than on anything they measure. The nightly entry in ops_unit_tests.yaml drops the
  # same tests by --ignore'ing these files; deselecting the marker instead keeps the
  # functional cases in test_chain_perf.py, which do run here.
  cmd: >-
    pytest --timeout 300 tests/ttnn/unit_tests/kernel_lib -xv
    -m "not disable_fast_runtime_mode and not models_device_performance_bare_metal"
  skus:
    wh_n300_civ2:
      timeout: 20
    bh_p150b_civ2:
      timeout: 20
  team: ttnn
  budget_type: sanity
  owner_id: U0BCCPS862F # Milan Alimpic

- name: "core ttnn unit test group"
  # The allocator suites run as their own pytest process: TT_METAL_ALLOCATOR_MODE_HYBRID is read
  # once when MetalContext is first constructed, so it must be set before this process opens a
  # device. Exporting it here rather than relying on the directory conftest's fixture also makes
  # the requirement visible, and satisfies the requires_hybrid_allocator marker on those tests.
  cmd: 'pytest --timeout 300 tests/ttnn/unit_tests/base_functionality tests/ttnn/unit_tests/benchmarks tests/ttnn/unit_tests/tensor -xv -m "not disable_fast_runtime_mode" && TT_METAL_ALLOCATOR_MODE_HYBRID=1 pytest --timeout 300 tests/ttnn/unit_tests/per_core_allocation -xv && TT_METAL_ALLOCATOR_MODE_HYBRID=1 pytest --timeout 300 tests/ttnn/unit_tests/range_lockstep_allocation -xv'
  ai_summary:
    authoritative_job_status: true
  skus:
    wh_n300_civ2:
      timeout: 45
    bh_p100:
      timeout: 40
    bh_p150b_civ2:
      timeout: 40
    sim_wh_n150:
      timeout: 40
    sim_bh_p150:
      timeout: 40
  team: ttnn
  budget_type: sanity
  owner_id: U076Z1JJUQZ # Artem Yerofieiev

