# ---------------------------------------------------------------------------------------------
# Quasar simulator coverage (#61750). sim_quasar -> libttsim_qsr.so on ubuntu-latest (sku_config.yaml);
# setup-ttsim exports TT_METAL_SIMULATOR, TT_METAL_SLOW_DISPATCH_MODE=1, TT_METAL_DISABLE_SFPLOADMACRO=1 and
# TT_METAL_QUASAR_NOC_API_VERSION=1. Every entry pins the two-compute-node grid the issue asks for with
# TT_METAL_CORE_GRID_OVERRIDE_TODEPRECATE="3,2" (an inclusive end coordinate: workers (2,2)-(3,2)).
#
# --forked is mandatory on this simulator: closing and re-opening a device in one process leaves the next
# kernel launch spinning forever (reproducer: pytest -n 0 .../ops/test_reshape_tiled.py, 2 cases, hangs on the
# second; the same two pass with --forked). The sim step of ttnn-sanity-tests-impl.yaml must therefore install
# pytest-forked next to pytest-xdist. -n 0 is given on the command line for the three model-op suites because
# their conftest's tt_device_lock (one flock for the whole module-scoped device) makes xdist workers error with
# DeviceLockTimeout after 60 s; command-line -n 0 beats the -n 4 the impl exports via PYTEST_ADDOPTS. The
# resnet entry has no such lock and keeps the impl's -n 4.
#
# The deselect lists are the cases that do not pass on main @ baeea9796bc + ttsim v1.12.1 (sweep of all 515
# cases, one process each, 20-min cap; details and per-case lists in #61750). Each family has or needs its own issue.
# ---------------------------------------------------------------------------------------------


# 11 of the 18 resnet50/quasar per-op files from #61750 item 1 (41 cases). Dropped: test_linear.py,
# test_conv2d_layer3_downsample_split.py, test_conv2d_layer_conv2_modelcfg.py (libttsim_qsr.so v1.12.1
# aborts with 'UnimplementedFunctionality: noc_cmd_ctrl: multicast'); test_avg_pool2d.py,
# test_global_avgpool.py, test_max_pool2d_1x3.py, test_max_pool2d_strided_reduce.py and the
# sharded_to_interleaved case of test_to_memory_config.py (no result after 20 min on the simulator).
- name: "ttnn quasar resnet50 ops"
  cmd: >-
    TT_METAL_CORE_GRID_OVERRIDE_TODEPRECATE="3,2" pytest --timeout 600 -v --forked models/demos/vision/classification/resnet50/quasar/tests/ops/test_reshape_tiled.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_padded_slice.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_reallocate.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_reshape.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_sharded_to_interleaved.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_slice_write.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_tilize.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_to_layout.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_to_memory_config.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_untilize_with_unpadding.py models/demos/vision/classification/resnet50/quasar/tests/ops/test_add.py
    --deselect=models/demos/vision/classification/resnet50/quasar/tests/ops/test_to_memory_config.py::test_quasar_to_memory_config_sharded_to_interleaved[quasar-device_params0]
  skus:
    sim_quasar:
      timeout: 10
  team: ttnn
  budget_type: sanity
  owner_id: U084B1CES7M # Borys Bradel

