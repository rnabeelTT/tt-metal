    ### Limitations
    - p150x4 and p150x2 run the same meshes as p300x2 / p300 but were not run on p150 boards.
    - Every newly admitted request re-captures the decode traces (keeping them live across prefills hung the NoC in v1),
      which shows up as TTFT under concurrent load.
    - In the 1,024 / 256 / 8-user row of the 4-die concurrency table one of 32 requests streamed no visible text and is
      excluded from its medians.
