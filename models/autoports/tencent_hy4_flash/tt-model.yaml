# tt-model container (v5.1) manifest: tencent/Hy4-flash (220B MoE, ~11.3B active, BF16 checkpoint) on one QB2
# (2 x p300 = 4 Blackhole dies). Every expert is resident on the device (bfp4); only the Engram n-gram tables stay on
# the host (FP8 rows, lossless for this model: it reads them through an FP8 round trip). Text, images and video; up to
# 8 users sharing one context pool (tt/pool.py): one user can take nearly all of it (202,752 tokens), more users split
# it; DFly2 speculative decoding (4 drafts). The profile mirrors models/experimental/hybrid_moe/serve/serve_hy4.sh.
# Only the official checkpoint is downloaded: the tensor cache (bfp4 experts and the other device tensors, ~100 GB)
# and the Engram FP8 store (~65 GB) are built from it on the first start, into the tt-model weight cache.
# Build: tt-model package --container <this yaml>, from a CLEAN worktree of the tested commit (git describe -dirty is
# baked into the image): ~/m27-work/hy4/pkg/RUNBOOK.md
schema: "5.1"

repo: raahemnabeel/hy4-flash
name: hy4-flash
weights: {repo: tencent/Hy4-flash, revision: b2498eba6a1a3f9bbcab4190bc1313a3c7010c2f}   # 2026-11-19; later eccd312 sets engram_fp8_embedding false (our FP8 store assumes true)
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/hy4-pkg   # clean detached worktree of raahem/hy4-flash-hybrid at the commit being published
  code:
    - models/autoports/tencent_hy4_flash/__init__.py
    - models/autoports/tencent_hy4_flash/tt
    - models/autoports/tencent_hy4_flash/serving
    - models/autoports/tencent_hy4_flash/vllm_bundle
    - models/experimental/hybrid_moe/engram_store.py
    - models/autoports/minimaxai_minimax_m2_7/__init__.py
    - models/autoports/minimaxai_minimax_m2_7/tt
    - models/demos/blackhole/qwen36
    - models/tt_transformers
    - models/common
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-hy4}   # branch hy4-dflash = dflash e0e2952 + upstream #135 (3509066: finished ids survive the decode fallback)
  extra_models_dir: models/autoports/tencent_hy4_flash/vllm_bundle

serve:
  block_size: 64
  capabilities:
    tool_parser: hy_v4
    reasoning_parser: hy_v4
  additional_config:
    tt:
      trace_mode: none
      sample_on_device_mode: all
      trace_region_size: 419430400
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: tencent/Hy4-flash
    TT_METAL_LOGGER_LEVEL: Error
    VLLM_ENGINE_READY_TIMEOUT_S: "21600"   # the first start builds ~165 GB of caches (tensor cache + Engram store) before ready
    PYTHONPATH: /opt/tt-metal/models/autoports/tencent_hy4_flash/serving:/opt/tt-metal
    HY4_TENSOR_CACHE: /weight-cache/hy4_tt        # bfp4 experts + other device tensors (~100 GB), written on the first boot
    HY4_ENGRAM_DIR: /weight-cache/hy4_engram      # FP8 Engram tables (~65 GB), built on the first boot
    HY4_TRACE_REGION: "419430400"
    HY4_SPEC_K: "4"                               # DFly2 drafts per verify pass (serve_hy4.sh SPEC=4)
  # Everything else is a code default at the packaged commit (HY4_BSPEC batched-spec policy, HY4_PF_* prefill paths,
  # HY4_MOE_STREAM, HY4_FB_FIDELITY HiFi3, HY4_RAM_CHECK error, HY4_ENGRAM_MADV random ...): only launch env lives here.
  # The image builds tt-metal from that commit, so its ttnn kernels/ops (grouped-matmul untilize fix, sparse_sdpa)
  # are in the image: no kernel mounts (serve_hy4.sh mounts them only for older dev images).
  # the name the dev scripts use (hy4-flash) besides the weights id, which stays the primary served name
  args: [[--served-model-name, tencent/Hy4-flash, hy4-flash]]

serve_profiles:
  - name: p300x2
    description: >
      Up to 8 concurrent users sharing one 202,752-token context pool: one request can use all of it, concurrent requests
      split it. Text, images and video.
    hardware: p300x2
    mesh_device: P300x2
    max_num_seqs: 8
    max_model_len: 202752
default_profile: p300x2

card:
  attribution: >-
    Derived from [tencent/Hy4-flash](https://huggingface.co/tencent/Hy4-flash) by Tencent. The experts run in bfp4
    and the Engram tables in FP8, converted from the official BF16 checkpoint on the first start. See the original
    model card for training and evaluation details.
  description: >-
    Hy4-flash, a 220B-parameter mixture-of-experts model with about 11.3B parameters active per token: 42 layers of
    sparse and sliding-window MLA attention, 512 routed experts (top-16) plus a shared expert, a 63.5B-parameter
    Engram n-gram memory, a vision encoder and a speculative drafter, served with vLLM. A reasoning model with text,
    image and video input and tool calling, for up to 8 concurrent users sharing a 202,752-token context pool (one
    user can use all of it).
  intended_use: >-
    Chat, reasoning, coding and tool use over text, images and short videos, including long documents.
  prerequisites: |
    - About 116 GB of free host RAM for full decode speed (17 GB minimum). With less than 116 GB free the server
      still starts but reads the Engram tables from disk and decodes more slowly. Below 17 GB it refuses to start
      (set `HY4_RAM_CHECK=warn` to start anyway).
    - About 610 GB of disk: the 440 GB checkpoint plus about 165 GB of caches built on the first start.
    - Optional: to keep the Engram tables from being swapped out under memory pressure, run the command that
      `tt-model serve --print` prints with `--ulimit memlock=-1:-1` added after `docker run`.
  quickstart: |
    The first start also builds about 165 GB of caches from the checkpoint (the bfp4 experts and the FP8 Engram
    tables) before the server is ready. Later starts are ready in about 4 minutes.
  usage: |
    `"hy4-flash"` also works as the model name.

    Reasoning is on by default (`reasoning_effort` `high`). For direct answers pass
    `"chat_template_kwargs": {"reasoning_effort": "no_think"}`; other values are rejected. Give thinking requests a
    large `max_tokens`: if the budget runs out inside the reasoning, `content` is empty.

    Requests without sampling parameters use temperature 0.9 and top_p 1.0. Greedy (temperature 0) is fastest.
    Logprobs, structured outputs, logit_bias and penalties are supported.

    Images: up to 4 per request (`image_url`), resized to at most 2048 x 2048. Video: one per request (`video_url`),
    sampled at 2 fps, at most 64 frames.

    One serving profile, `p300x2`: all requests share one context pool. A single request can be up to 202,752 tokens
    (prompt + output), and concurrent requests split the pool. When the pool runs out, vLLM pauses a request and
    recomputes it later.

    A new prompt that shares its first 2,048 or more tokens with a finished request (the next chat turn, or the same
    document with a new question) reuses that request's cache. The output is the same as without reuse.
  performance: |
    | eval | this package | SE | reference | prompts | setting |
    | --- | ---: | ---: | ---: | ---: | --- |
    | GSM8K (8-shot CoT, strict match) | 95.6% | 0.6 | — | 1,319 | no_think, greedy |
    | IFEval (prompt-level strict) | 83.9% | 1.6 | — | 541 | no_think, greedy |
    | HumanEval pass@1 | 97.0% | 1.3 | — | 164 | no_think, greedy |
    | MBPP (3-shot) | 83.4% | 1.7 | — | 500 | no_think, greedy |
    | GPQA-Diamond | 77.8% | 3.0 | — | 198 | no_think, greedy |
    | MATH-500 | 95.6% | 0.9 | — | 500 | no_think, greedy |
    | MMLU-Pro (fixed 1,000-question subset) | 73.3% | 1.4 | — | 1,000 | no_think, greedy |
    | GPQA-Diamond, thinking | 87.4% | 2.4 | — | 198 | high, temperature 0.9, max_tokens 18,944 |
    | Needle retrieval (2K-11K, alone and with 7 users) | 6/6 | — | — | 6 | no_think, greedy |
    | Top-1 agreement / KL (top 32) with the BF16 reference, 8 users | 86.5% / 0.223 | — | — | 8 texts | teacher forced |
    | Same, 3K-token text, prefill / decode | 82.7% / 0.293, 82.8% / 0.275 | — | — | 1 text | teacher forced |

    Evals served through the OpenAI endpoint with 8 requests in flight (lm-evaluation-harness; seed 42).
    SE = sqrt(p(1-p)/n). Tencent publishes no figures for these settings.

    | profile | sampling | ISL | OSL | concurrency | N | TTFT (s) | prefill tok/s/u | decode tok/s/u | total tok/s | E2EL (s) |
    | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | T 0.9 | ~30 | 256 | 1 | 8 | 0.21 | — | 65.9 | — | 4.09 |
    | p300x2 | T 0.9 | ~30 | 256 | 2 | 8 | 0.24 | — | 60.0 | 108.1 | 4.51 |
    | p300x2 | T 0.9 | ~30 | 256 | 3 | 12 | 0.24 | — | 45.3 | 128.5 | 5.87 |
