    | p300x2 | greedy | ~30 | 256 | 8 | 32 | 0.24 | — | 30.6 | 236.7 | 8.61 |
    | p300x2 | greedy | 132 | 64 | 1 | 3 | 0.22 | 600 | 64.9 | — | 1.19 |
    | p300x2 | greedy | 516 | 64 | 1 | 3 | 0.35 | 1,475 | 61.5 | — | 1.37 |
    | p300x2 | greedy | 1,028 | 64 | 1 | 3 | 0.50 | 2,037 | 65.1 | — | 1.47 |
    | p300x2 | greedy | 2,052 | 128 | 1 | 3 | 0.73 | 2,799 | 57.2 | — | 2.95 |
