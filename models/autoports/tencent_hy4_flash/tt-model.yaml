    | p300x2 | greedy | 16,388 | 128 | 1 | 3 | 4.82 | 3,401 | 68.2 | — | 6.68 |
    | p300x2 | greedy | 2,052 | 128 | 8 | 8 | 5.96 | 344 | 17.1 | 68.3 | 13.41 |
