    | p300x2 | greedy | 131,076 | 128 | 1 | 1 | 38.87 | 3,372 | 65.4 | — | 40.81 |
    | p300x2 | greedy | 200,004 | 128 | 1 | 1 | 61.54 | 3,250 | 64.6 | — | 63.51 |
    | p300x2 | T 0.9 | 32,772 | 128 | 1 | 2 | 9.53 | 3,439 | 67.6 | — | 11.44 |
    | p300x2 | T 0.9 | 131,076 | 128 | 1 | 1 | 38.86 | 3,373 | 55.4 | — | 41.15 |

    A long prompt is prefilled in 2,048-token parts with decode steps for the other users in between: while a 64K or
    200K-token prompt is prefilled, the other users' longest pause between tokens is 0.7-0.8 s. Prefix reuse: a
    10K-token prompt has a TTFT of 3.36 s cold and 0.69 s when it is resent or continued as the next chat turn. Images:
    one 1024 x 1024 image, TTFT 0.63 s alone and 1.33 s with 7 text users. Video (64 frames, 640 x 480): TTFT 1.48 s
    alone and 2.16 s with 7 text users. Needle retrieval at 32K, 131K and 200K tokens (depths 10, 50 and 90%): 9 of 9
    found.

    Medians over N requests, measured on one QB2 through the OpenAI endpoint with the package's launch command, warm
    caches, 2026-11-24. Concurrency = streamed requests in flight; prefill tok/s/u = prompt tokens / TTFT; decode tok/s/u
    = (output tokens - 1) / (E2EL - TTFT); total tok/s = all output tokens / wall time. "T 0.9" = temperature 0.9,
    top_p 1.0, the model's default sampling. Single-user decode speed depends on the text (speculative decoding).
  limitations: |
    - Not for decisions about people (medical, legal, financial, hiring) without human review; like any language
      model it can state wrong facts with confidence.
    - At most 8 concurrent users, and their contexts together cannot exceed the 202,752-token pool; a request that
      does not fit waits until others finish.
    - Per-user decode speed drops as users are added, and decode is slower at long context (see Performance).
    - Several long prompts that arrive together are prefilled one after another, so the last one waits longer for its
      first token; a long prompt's TTFT is also longer while other users are decoding.
    - Outputs differ slightly from the BF16 reference (bfp4 experts, FP8 Engram tables; see the agreement rows).
    - Weights are pinned to revision b2498eb of tencent/Hy4-flash. Later revisions are not supported.
    - Runs only on a QB2 (4 Blackhole dies); other boards are not supported.
  licensing: >-
    Weights: Tencent Hy License 1.0 (Apache-2.0 based). Commercial use is allowed, but a model-as-a-service business
    needs a separate license from Tencent if its revenue is above US$50 million a year or the product has more than
