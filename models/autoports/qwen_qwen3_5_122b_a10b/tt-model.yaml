# tt-model container (v5.1) manifest for the Qwen3.5-122B-A10B autoport on 4 Blackhole dies (p300x2 / p150x4).
# Authoring interface of `tt-model package --container models/autoports/qwen_qwen3_5_122b_a10b/tt-model.yaml`.
schema: "5.1"

repo: raahemnabeel/qwen3-5-122b-a10b-blackholex4
name: qwen3-5-122b-a10b-blackholex4
# weights stay a pointer: the exact HF snapshot every stage of the bring-up validated
weights: {repo: Qwen/Qwen3.5-122B-A10B, revision: dc4d348443bc740c68e2d77492492c11606384d5}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal
  code:  # the autoport's import closure (checked with a symlinked tree of exactly these paths); the autoport ships its
         # runtime files only (not the per-stage doc/ evidence with profiler CSVs, not tests/)
    - models/autoports/qwen_qwen3_5_122b_a10b/__init__.py
    - models/autoports/qwen_qwen3_5_122b_a10b/tt
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_metadata.json
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/context_contract.json            # read by generator_vllm at build
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/datatype_sweep/selected_precision_config.json   # the shipped precision policy
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # the released sdist built in the image with VLLM_TARGET_DEVICE=empty, installed --no-deps on top of the lock (the
  # wheel form resolves the wheel's own dependency set and would pull torch 2.14 over tt-metal's 2.11.0 pin)
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin}
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json (a copy of the autoport's vllm_metadata.json lives in
  # vllm_bundle/qwen3_5_122b_a10b/; the checkout-based serving uses EXTRA_MODELS_DIR=models/autoports directly)
  extra_models_dir: models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
  # resolution overrides: the torch / torchvision tt-metal pins (the ttnn extension is built against 2.11.0) and the
  # transformers this bring-up validated; vLLM 0.26.0 would otherwise resolve torch 2.14 (a full dev-env freeze as a lock
  # dragged unrelated conflicting pins in, so the build resolves live under these overrides and freezes the result)
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 262144
  capabilities:
    tool_parser: qwen3_xml
    reasoning_parser: qwen3
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: Qwen/Qwen3.5-122B-A10B
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
  # Thinking OFF by default: the configuration every release gate ran on (TTI release, 22 / 22 conformance tests, full-set
  # evals). The model's own default (thinking on) loops on constraint-heavy prompts under greedy / low-temperature decoding
  # (reproduced by the bf16 HF reference; doc/tti_release/RUN_NOTES.md run 7) and returns an empty `content` when the budget
  # ends inside the think block. Clients opt in per request with "chat_template_kwargs": {"enable_thinking": true}.
  args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": false}']

serve_profiles:  # one image, the two 4-die Blackhole targets; both are the (1,4) mesh
  - name: p300x2
    description: Two p300 boards (4 dies), 32 concurrent sequences, 262144 context.
    hardware: p300x2
    mesh_device: P300x2
  - name: p150x4
    description: Four p150 boards, 32 concurrent sequences, 262144 context (same (1,4) mesh; untested on this host).
    hardware: p150x4
    mesh_device: P150x4
default_profile: p300x2

verify:
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.generator_vllm as g; assert g.Qwen35MoeForConditionalGeneration"
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  description: >
    Qwen3.5-122B-A10B (256-expert MoE, 48 layers of Gated DeltaNet + gated attention) served text-only on four Blackhole
    dies through vLLM and the Tenstorrent plugin: tensor-parallel mixers, experts sharded on the intermediate dimension,
    on-device sampling, per-width decode traces, 262144-token context, up to 32 concurrent sequences.
  quickstart: |
    ### Use with your client
    Point an OpenAI-compatible client at `http://127.0.0.1:20000` (or the port `tt-model serve` printed) with model
    `Qwen/Qwen3.5-122B-A10B`. Thinking is OFF by default in this bundle (the validated release configuration); turn it on
    per request with `"chat_template_kwargs": {"enable_thinking": true}` — the reasoning then arrives in the message's
    `reasoning` field (vLLM 0.26; older clients know it as `reasoning_content`) and needs a large `max_tokens`
    (thousands): when the budget ends inside the think block, `content` is empty. In thinking mode the model tends to
    deliberate at length and can repeat itself on constraint-heavy prompts (also with the bf16 reference weights); use
    the model card's general thinking preset (temperature 1.0, top_p 0.95, top_k 20, presence_penalty 1.5) rather than
    greedy decoding there.
    Tool calls use the `qwen3_xml` parser.
