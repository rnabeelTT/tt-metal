# tt-model container (v5.1) manifest for Qwen3.5-122B-A10B (the fused-decode "blackhole-fast" build, now the current
# bundle in the official repo; user, 2026-10-27): the v1 bundle (raahemnabeel/qwen3-5-122b-a10b-v1, this directory's tt-model.yaml) plus the fused decode work ported from the Ornith
# fusion (models/autoports/ornith_ai_ornith_1_5_35b_a3b/fusion/HANDOFF.md):
# - steps 1-3: routed + shared experts in three ops that stream the expert weights in place for every decode width
#   (1..32 rows), and the replicated-residual decode boundary;
# - steps 4-5: the Gated DeltaNet decode mixer and the attention decode prep / post ops, for 1-32 rows; MTP off (its
#   verify pass keeps the unfused path: plain fused decode is faster);
# - step 7: the fabric layer boundary (all-reduce + residual + RMSNorm as one op, 1-4 rows) with the next projection /
#   router in its program, the sampler's live-rows top-k, the GDN head value split.
# Same weights, plugin build and serving recipe; the one fast repo (its earlier revisions stay in the Hub history).
# Package name = the plain model name (image tt-model/qwen3-5-122b-a10b; user, 2026-10-26).
schema: "5.1"

repo: raahemnabeel/qwen3-5-122b-a10b
name: qwen3-5-122b-a10b
# weights stay a pointer: the exact HF snapshot every stage of the bring-up validated
weights: {repo: Qwen/Qwen3.5-122B-A10B, revision: dc4d348443bc740c68e2d77492492c11606384d5}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal-q122   # worktree, branch q122_fusion
  code:  # the autoport's import closure (checked with a symlinked tree of exactly these paths); the autoport ships its
         # runtime files only (not the per-stage doc/ evidence with profiler CSVs, not tests/)
    - models/autoports/qwen_qwen3_5_122b_a10b/__init__.py
    - models/autoports/qwen_qwen3_5_122b_a10b/tt
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_metadata.json
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/context_contract.json            # read by generator_vllm at build
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/datatype_sweep/selected_precision_config.json   # the shipped precision policy
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # the released sdist built in the image with VLLM_TARGET_DEVICE=empty, installed --no-deps on top of the lock (the
  # wheel form resolves the wheel's own dependency set and would pull torch 2.14 over tt-metal's 2.11.0 pin)
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-pub}   # the plugin build the published image shipped
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json (a copy of the autoport's vllm_metadata.json lives in
  # vllm_bundle/qwen3_5_122b_a10b/; the checkout-based serving uses EXTRA_MODELS_DIR=models/autoports directly)
  extra_models_dir: models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
  # resolution overrides: the torch / torchvision tt-metal pins (the ttnn extension is built against 2.11.0) and the
  # transformers this bring-up validated; vLLM 0.26.0 would otherwise resolve torch 2.14 (a full dev-env freeze as a lock
  # dragged unrelated conflicting pins in, so the build resolves live under these overrides and freezes the result)
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 262144
  capabilities:
    tool_parser: qwen3_xml
    reasoning_parser: qwen3
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: Qwen/Qwen3.5-122B-A10B
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
    # the fused decode path (ported from the Ornith fusion)
    QWEN35_MOE_FUSED_DECODE: "1"
    QWEN35_DECODE_REPLICATED: "1"
    # Ornith fusion steps 4-5: GDN decode mixer ops + attention decode ops; MTP off (its verify pass keeps the unfused
    # path: plain fused decode is faster, 94 vs 60 tok/s on chat text at 1 user)
    QWEN35_GDN_DECODE_OPS: "1"
    QWEN35_ATTN_DECODE_OPS: "1"
    QWEN35_MTP: "0"
    # step 7 (every profile is 4 dies): fabric layer boundary for 1-4 rows with the next projection / router in its
    # program, sampler top-k over the live rows (62080 columns per die)
    QWEN35_FABRIC_BOUNDARY: "1"
    QWEN35_FB_MAX_ROWS: "4"
    QWEN35_FB_CONSUMER: "1"
    QWEN35_FB_ROUTER: "1"
    QWEN35_ROWS_TOPK: "1"
    # Vision ON: image content parts are served (the checkpoint's ViT on the mesh, bfp8, up to 4 images per request);
    # text requests are unaffected (the tower only runs for image prompts). KV pool in this configuration (MTP head +
    # tower resident): 22725 blocks x 64 tokens = 1.45 M tokens (the stage-13 text-only, no-MTP server had 28472 blocks).
    # Set to "0" for a text-only server.
    QWEN35_VISION: "1"
    QWEN35_VISION_MAX_IMAGES: "4"
    # Served image-resolution cap: 4 MP = 16384 patches = 4096 image tokens per image (the checkpoint's processor default
    # is 16 MP). The tower's programs are keyed by the padded patch count; every bucket up to this cap is warmed at
    # start-up, so no image request compiles a program after the traces are parked (2026-10-01 served image failure).
    QWEN35_VISION_MAX_PIXELS: "4194304"
    # Batched short-prompt prefill: OPT-IN ("1"). Final text prompts <= 512 tokens that arrive together are prefilled
    # up to four per pass (served A/B 2026-10-02: TTFT at 32 users 6.3 -> 3.8 s, at 8 users 1.83 -> 1.27 s, decode
    # unchanged) but the first-token numerics then differ from a single admission (batched GDN form, PCC 0.9995), and
    # the parameter-conformance suite's seeded-reproducibility / greedy-consistency tests across batch compositions
    # failed (12 / 73, bundle run 8). Off keeps 73 / 73; turn on for throughput-first deployments.
    QWEN35_BATCHED_PREFILL: "0"
  # Thinking ON by default (owner decision 2026-10-02; the model's own default): a plain chat request reasons first and
  # answers in `content`; the reasoning arrives in the message's `reasoning` field (vLLM 0.26; `reasoning_content` in
  # older clients). Clients turn it off per request with "chat_template_kwargs": {"enable_thinking": false}. Caveats
  # measured on this port (doc/tti_release/thinking_default_test, RUN_NOTES run 7): in thinking mode the model
  # deliberates at length (give it thousands of tokens of budget; `content` is empty when the budget ends inside the
  # think block) and can repeat itself on constraint-heavy prompts under greedy decoding (also with the bf16 reference
  # weights) - the checkpoint's generation_config (temperature 0.6, top_p 0.95, top_k 20) applies when a request sends no
  # sampling parameters. Every release gate (TTI release, 73 / 73 and 22 / 22 conformance) ran with thinking OFF, i.e.
  # the per-request {"enable_thinking": false} configuration.
  args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}']

# One image serves every profile; a profile is a launch configuration (env + args merged over `serve`). Pick with
# `tt-model serve <bundle> --profile <name>`. Numbers: doc/perf_pass/deployed_sweep.md and doc/HANDOFF.md §1.
serve_profiles:
  - name: p300x2
    description: 'Default. Interactive assistants and agents: text and images, thinking on.'
    hardware: p300x2
    mesh_device: P300x2
  - name: p300x2-burst
    description: 'Many short prompts arriving together (chat front-ends, batch jobs): prompts of up to 512 tokens are prefilled up to four at a time, so a 32-request burst gets its first token in about 3.8 s instead of 6.3 s; decode speed unchanged. A request''s first token can depend on which requests arrived with it.'
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_BATCHED_PREFILL: "1"}
  - name: p300x2-longctx
    description: 'Very long prompts mixed with short ones (documents, codebases): prefill runs in 4,096-token chunks shared between prompts, so a short request is not stuck behind a 100k-token one. Users already decoding pause while prefill chunks run.'
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_CHUNKED_PREFILL: "1", QWEN35_MTP: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}', --enable-chunked-prefill, [--max-num-batched-tokens, "4096"]]
  - name: p300x2-text
    description: 'Text only, largest KV pool: the vision encoder is not loaded (1.8 M pooled KV tokens instead of 1.45 M) and image requests are rejected.'
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_VISION: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
  # The same four configurations on four p150 boards (the identical (1,4) mesh; kernels compile at launch). Untested on
  # this host (p300x2 only); the p300x2 numbers are the expectation.
  - name: p150x4
    description: '`p300x2` on four p150 boards.'
    hardware: p150x4
    mesh_device: P150x4
  - name: p150x4-burst
    description: '`p300x2-burst` on four p150 boards.'
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_BATCHED_PREFILL: "1"}
  - name: p150x4-longctx
    description: '`p300x2-longctx` on four p150 boards.'
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_CHUNKED_PREFILL: "1", QWEN35_MTP: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}', --enable-chunked-prefill, [--max-num-batched-tokens, "4096"]]
  - name: p150x4-text
    description: '`p300x2-text` on four p150 boards.'
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_VISION: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
default_profile: p300x2

verify:
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.generator_vllm as g; assert g.Qwen35MoeForConditionalGeneration"
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  attribution: |
    Derived from [Qwen/Qwen3.5-122B-A10B](https://huggingface.co/Qwen/Qwen3.5-122B-A10B) by the Qwen team. The
    checkpoint is used as published; expert weights are converted to lower precision when the server loads them
    (see Limitations). See the original model card for training and evaluation details.
  description: |
    Qwen3.5-122B-A10B, a 122B-parameter mixture-of-experts model with 10B parameters active per token (256 experts,
    top-8 plus a shared expert; 48 layers mixing Gated DeltaNet linear attention with gated full attention) and a
    vision encoder, served with vLLM. Thinks before it answers by default; text and image input, tool calling and a
    262,144-token context, for up to 32 concurrent users.
  intended_use: |
    Chat, reasoning, coding and tool use over text and images, through an OpenAI-compatible API.
  usage: |
    Thinking is on by default. Give thinking requests a large `max_tokens` (thousands): when the budget runs out inside
    the reasoning, `content` is empty.
    Turn thinking off per request with `"chat_template_kwargs": {"enable_thinking": false}`.

    A request without sampling parameters uses the checkpoint's defaults (temperature 0.6, top_p 0.95, top_k 20). Qwen's card recommends temperature 1.0, top_p 0.95, top_k 20, presence_penalty 1.5 for thinking on general tasks and temperature 0.6 for precise coding. Sampling runs on the
    device; `top_k` is limited to 32.

    Images: up to 4 per request as `image_url` parts, resized to at most 4 MP (not on the `-text` profiles). Video input is not accepted.

    Prefix caching is on. A prompt that starts with the same 2,048 or more tokens as a recent one (a document sent
    again, the next turn of a chat, a shared system prompt) resumes from the last 2,048-token boundary the two share
    instead of being prefilled from the start. The server keeps 32 such resume points, least recently used
    evicted; they use 1.4 GiB of each die's KV pool. Turn caching off with `tt-model serve <repo> -- --no-enable-prefix-caching`.
  performance: |
    ### Accuracy
    Evaluated through the served chat API (p300x2, thinking off, one sample per question, seed 42, temperature 0.6 /
    top_p 0.95 / top_k 20, lm-evaluation-harness), next to the previous version of this package (v1) on the same box
    and settings. The reference column is Qwen's model card, measured with thinking on and Qwen's own harness, so it
    is not measured the same way as the other two columns.

    | Eval | v1 | this package | reference (Qwen card, thinking on) | prompts |
    | --- | ---: | ---: | ---: | ---: |
    | GPQA-Diamond | 0.697 | 0.697 ±0.033 | 0.866 | 198 |
    | IFEval prompt-level strict | 0.85 | 0.88 ±0.033 | 0.934 (IFEval) | 100 |
    | LiveCodeBench v6 | 0.54 | 0.54 ±0.071 | 0.789 | 50 |

    ### Performance
    Measured on one QuietBox 2 (4 Blackhole p300c dies; v1 2026-10-23, current 2026-10-26), both bundles
    served exactly as shipped (`tt-model serve <bundle> --profile p300x2`), one server at a time: random-token prompts of exactly the input length, output
    pinned with ignore_eos, streamed; users are concurrent requests in a closed loop; TTFT = time to first streamed token;
    TPOT = (E2EL - TTFT) / (output - 1); one unrecorded warm-up per row. v1's single-user rows run MTP
    speculative decoding, whose gain depends on how predictable the text is (random-token prompts understate it), so a
    real-text row (12 chat prompts, 384 output tokens, temperature 0) is added; this bundle decodes without MTP. Each cell is `v1 -> current`.

    | Profile | ISL | OSL | Concurrency | N | TTFT (ms) | Prefill tok/s/u | Decode tok/s/u | E2EL (s) |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | 128 | 128 | 1 | 4 | 216 | 592 | 130.9 | 1.19 |
    | p300x2 | 1024 | 256 | 32 | 128 | 11,953 | 86 | 21.4 | 23.85 |
    | p300x2-longctx | 128 | 128 | 1 | 4 | 212 | 604 | 132.5 | 1.17 |

    #### p300x2

    Latency, batch 1 (single user): v1 -> current

    | Input tokens | Output tokens | TTFT (ms) | Prefill tok/s | TPOT (ms) | Decode tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 128 | 128 | 305 -> 216 | 420 -> 592 | 30.2 -> 7.6 | 33.1 -> **130.9** (+295 %) | 4.13 -> 1.19 |
    | 1,024 | 256 | 502 -> 418 | 2,038 -> 2,450 | 24.6 -> 7.7 | 40.6 -> **129.9** (+220 %) | 6.76 -> 2.38 |
    | 4,096 | 256 | 1,217 -> 1,096 | 3,365 -> 3,737 | 20.6 -> 7.9 | 48.4 -> **126.9** (+162 %) | 6.48 -> 3.13 |
    | 16,384 | 256 | 4,568 -> 4,400 | 3,586 -> 3,723 | 25.8 -> 8.1 | 38.8 -> **123.5** (+218 %) | 11.13 -> 6.47 |
    | 32,768 | 256 | 9,310 -> 9,039 | 3,520 -> 3,625 | 21.2 -> 8.4 | 47.2 -> **118.5** (+151 %) | 14.71 -> 11.19 |
    | 65,536 | 256 | 19,803 -> 19,142 | 3,309 -> 3,424 | 31.6 -> 9.0 | 31.7 -> **110.8** (+250 %) | 27.85 -> 21.44 |
    | 130,816 | 256 | 44,598 -> 42,978 | 2,933 -> 3,044 | 27.7 -> 10.2 | 36.1 -> **98.4** (+173 %) | 51.67 -> 45.57 |

    Real text, single user (12 chat prompts x 384 output tokens, temperature 0, v1 with MTP, current without; median per prompt): 45.9 -> **131.8 tok/s** (+187 %).

    Concurrency, 128 input / 128 output tokens: v1 -> current

    | Users | N | TTFT (ms) | TPOT (ms) | Decode tok/s/user | Total out tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 2 | 8 | 522 -> 496 | 37.0 -> 12.7 | 27.0 -> 78.7 | 49.0 -> **121.2** (+147 %) | 5.22 -> 2.11 |
    | 4 | 16 | 1,035 -> 977 | 44.5 -> 16.6 | 22.5 -> 60.3 | 76.5 -> **166.9** (+118 %) | 6.69 -> 3.09 |
    | 8 | 32 | 1,785 -> 1,701 | 63.7 -> 25.5 | 15.7 -> 39.2 | 103.5 -> **208.6** (+102 %) | 9.90 -> 4.92 |
    | 16 | 64 | 3,321 -> 3,215 | 96.9 -> 35.2 | 10.3 -> 28.4 | 131.6 -> **265.4** (+102 %) | 15.61 -> 7.70 |
    | 32 | 128 | 6,253 -> 6,028 | 113.4 -> 45.1 | 8.8 -> 22.2 | 198.6 -> **347.1** (+75 %) | 20.62 -> 11.79 |

    Concurrency, 1024 input / 256 output tokens: v1 -> current

    | Users | N | TTFT (ms) | TPOT (ms) | Decode tok/s/user | Total out tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 2 | 8 | 891 -> 861 | 36.2 -> 12.0 | 27.6 -> 83.2 | 50.5 -> **129.8** (+157 %) | 10.13 -> 3.95 |
    | 4 | 16 | 1,771 -> 1,737 | 44.4 -> 16.8 | 22.5 -> 59.4 | 78.2 -> **171.2** (+119 %) | 13.09 -> 6.01 |
    | 8 | 32 | 3,281 -> 3,175 | 63.8 -> 25.2 | 15.7 -> 39.6 | 104.8 -> **214.2** (+104 %) | 19.55 -> 9.56 |
    | 16 | 64 | 6,269 -> 6,134 | 97.6 -> 36.4 | 10.2 -> 27.4 | 131.6 -> **267.7** (+103 %) | 31.13 -> 15.34 |
    | 32 | 128 | 12,215 -> 11,953 | 114.9 -> 46.8 | 8.7 -> 21.4 | 197.3 -> **344.2** (+74 %) | 41.54 -> 23.85 |

    #### p300x2-longctx (chunked prefill at 4096 tokens; v1 without MTP)

    Latency, batch 1 (single user): v1 -> current

    | Input tokens | Output tokens | TTFT (ms) | Prefill tok/s | TPOT (ms) | Decode tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 128 | 128 | 204 -> 212 | 626 -> 604 | 31.3 -> 7.5 | 31.9 -> **132.5** (+315 %) | 4.18 -> 1.17 |
    | 2,048 | 128 | 590 -> 592 | 3,469 -> 3,458 | 31.3 -> 7.7 | 31.9 -> **129.7** (+307 %) | 4.57 -> 1.57 |

    Real text, single user (12 chat prompts x 384 output tokens, temperature 0, MTP off in both; median per prompt): 31.9 -> **131.9 tok/s** (+313 %).

    ### Prefix caching
    Measured 2026-10-28 on p300x2, one user, temperature 0: the same build served with caching off and on. TTFT of a
    prompt (Python source from this repo) sent a second time, and of each turn of a chat that opens with an 8k-token code
    document and resends the conversation so far (as every chat client does):

    | Request | caching off | caching on |
    | --- | ---: | ---: |
    | 7,652-token prompt, sent again | 2.20 s | 0.68 s (3.3x) |
    | 24,224-token prompt, sent again | 6.66 s | 0.74 s (9.0x) |
    | chat turns 2-6 (7.9k-8.6k tokens) | 2.17-2.44 s | 0.26-0.76 s |
    | chat with thinking on, turns 1-4 (4.0k-4.1k tokens, the document cached by the chat above) | 1.09-1.22 s | 0.58-0.71 s |

    Prompts seen for the first time are unchanged: no-hit rows at 128 / 2,048 / 8,192 input tokens (1 user) and 128/128 at
    32 users, TTFT and TPOT within 2 % (1 user 128/128: TTFT 191 / 192 ms, TPOT 7.54 / 7.54 ms). Greedy output with caching on matched caching off on every resent prompt and on all 10 chat turns.
  limitations: |
    - The checkpoint's MTP head is not used: decoding produces one token per step, without speculative decoding.
    - Expert weights run at reduced precision (routed experts in 4-bit block floating point), so output can differ
      from the bf16 original where two candidate tokens are close; see Accuracy.
    - With thinking on and greedy decoding (temperature 0) the model can repeat itself on constraint-heavy prompts, as
      the original bf16 model does; use the default sampling settings.
    - Evals ran with thinking off, IFEval and LiveCodeBench on subsets (100 / 50 questions).
    - Speed was measured on the `p300x2` and `p300x2-longctx` profiles. The `-burst` and `-text` profiles were not
      benchmarked, and the p150x4 profiles were not run on p150 boards.
    - On the `-burst` profiles a request's first token can depend on which other requests arrived with it, so seeded
      output is not reproducible across batch compositions.
    - Prefix caching resumes only at 2,048-token boundaries: a prompt sharing fewer than 2,048 tokens with an earlier one
      gets no benefit, and the shared tokens past the last boundary are prefilled again. Requests with images are not
      cached. With caching on, a resumed prompt's output can differ from an uncached run where two candidate tokens are
      nearly tied (greedy output matched on all 10 chat turns measured).
    - The device sampler supports `top_k` up to 32; a larger `top_k` is clamped to 32.
    - Startup takes about 14 minutes on p300x2.
    - Not for unattended high-stakes decisions (medical, legal, financial, safety-critical) or as a source of facts
      without checking: the model can state wrong things confidently. Review generated code and tool calls, or run them in
      a sandbox, before they act on real systems. No safety evaluation was run on this package beyond the original
      model's.
  related: |
    - [raahemnabeel/qwen3-5-122b-a10b-v1](https://huggingface.co/raahemnabeel/qwen3-5-122b-a10b-v1): the previous
      version of this package (the `v1` columns above), replaced by this one.
    - [raahemnabeel/ornith-1.5-122b](https://huggingface.co/raahemnabeel/ornith-1.5-122b): Ornith-1.5-122B, the same
      architecture on the same serving code.
