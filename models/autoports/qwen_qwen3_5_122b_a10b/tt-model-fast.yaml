# tt-model container (v5.1) manifest for Qwen3.5-122B-A10B "blackhole-fast": the published bundle
# (raahemnabeel/qwen3-5-122b-a10b, this directory's tt-model.yaml) plus the fused decode work ported from the Ornith
# fusion (models/autoports/ornith_ai_ornith_1_5_35b_a3b/fusion/HANDOFF.md):
# - steps 1-3: routed + shared experts in three ops that stream the expert weights in place for every decode width
#   (1..32 rows), and the replicated-residual decode boundary;
# - steps 4-5: the Gated DeltaNet decode mixer and the attention decode prep / post ops, for 1-32 rows; MTP off (its
#   verify pass keeps the unfused path: plain fused decode is faster);
# - step 7: the fabric layer boundary (all-reduce + residual + RMSNorm as one op, 1-4 rows) with the next projection /
#   router in its program, the sampler's live-rows top-k, the GDN head value split.
# Same weights, plugin build and serving recipe; the one fast repo (its earlier revisions stay in the Hub history).
# Package name = the plain model name (image tt-model/qwen3-5-122b-a10b; user, 2026-10-26).
schema: "5.1"

repo: raahemnabeel/qwen3-5-122b-a10b-blackhole-fast
name: qwen3-5-122b-a10b
# weights stay a pointer: the exact HF snapshot every stage of the bring-up validated
weights: {repo: Qwen/Qwen3.5-122B-A10B, revision: dc4d348443bc740c68e2d77492492c11606384d5}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal-q122   # worktree, branch q122_fusion
  code:  # the autoport's import closure (checked with a symlinked tree of exactly these paths); the autoport ships its
         # runtime files only (not the per-stage doc/ evidence with profiler CSVs, not tests/)
    - models/autoports/qwen_qwen3_5_122b_a10b/__init__.py
    - models/autoports/qwen_qwen3_5_122b_a10b/tt
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_metadata.json
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/context_contract.json            # read by generator_vllm at build
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/datatype_sweep/selected_precision_config.json   # the shipped precision policy
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # the released sdist built in the image with VLLM_TARGET_DEVICE=empty, installed --no-deps on top of the lock (the
  # wheel form resolves the wheel's own dependency set and would pull torch 2.14 over tt-metal's 2.11.0 pin)
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-pub}   # the plugin build the published image shipped
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json (a copy of the autoport's vllm_metadata.json lives in
  # vllm_bundle/qwen3_5_122b_a10b/; the checkout-based serving uses EXTRA_MODELS_DIR=models/autoports directly)
  extra_models_dir: models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
  # resolution overrides: the torch / torchvision tt-metal pins (the ttnn extension is built against 2.11.0) and the
  # transformers this bring-up validated; vLLM 0.26.0 would otherwise resolve torch 2.14 (a full dev-env freeze as a lock
  # dragged unrelated conflicting pins in, so the build resolves live under these overrides and freezes the result)
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 262144
  capabilities:
    tool_parser: qwen3_xml
    reasoning_parser: qwen3
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: Qwen/Qwen3.5-122B-A10B
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
    # the fused decode path (ported from the Ornith fusion)
    QWEN35_MOE_FUSED_DECODE: "1"
    QWEN35_DECODE_REPLICATED: "1"
    # Ornith fusion steps 4-5: GDN decode mixer ops + attention decode ops; MTP off (its verify pass keeps the unfused
    # path: plain fused decode is faster, 94 vs 60 tok/s on chat text at 1 user)
    QWEN35_GDN_DECODE_OPS: "1"
    QWEN35_ATTN_DECODE_OPS: "1"
    QWEN35_MTP: "0"
    # step 7 (every profile is 4 dies): fabric layer boundary for 1-4 rows with the next projection / router in its
    # program, sampler top-k over the live rows (62080 columns per die)
    QWEN35_FABRIC_BOUNDARY: "1"
    QWEN35_FB_MAX_ROWS: "4"
    QWEN35_FB_CONSUMER: "1"
    QWEN35_FB_ROUTER: "1"
    QWEN35_ROWS_TOPK: "1"
    # Vision ON: image content parts are served (the checkpoint's ViT on the mesh, bfp8, up to 4 images per request);
    # text requests are unaffected (the tower only runs for image prompts). KV pool in this configuration (MTP head +
    # tower resident): 22725 blocks x 64 tokens = 1.45 M tokens (the stage-13 text-only, no-MTP server had 28472 blocks).
    # Set to "0" for a text-only server.
    QWEN35_VISION: "1"
    QWEN35_VISION_MAX_IMAGES: "4"
    # Served image-resolution cap: 4 MP = 16384 patches = 4096 image tokens per image (the checkpoint's processor default
    # is 16 MP). The tower's programs are keyed by the padded patch count; every bucket up to this cap is warmed at
    # start-up, so no image request compiles a program after the traces are parked (2026-10-01 served image failure).
    QWEN35_VISION_MAX_PIXELS: "4194304"
    # Batched short-prompt prefill: OPT-IN ("1"). Final text prompts <= 512 tokens that arrive together are prefilled
    # up to four per pass (served A/B 2026-10-02: TTFT at 32 users 6.3 -> 3.8 s, at 8 users 1.83 -> 1.27 s, decode
    # unchanged) but the first-token numerics then differ from a single admission (batched GDN form, PCC 0.9995), and
    # the parameter-conformance suite's seeded-reproducibility / greedy-consistency tests across batch compositions
    # failed (12 / 73, bundle run 8). Off keeps 73 / 73; turn on for throughput-first deployments.
    QWEN35_BATCHED_PREFILL: "0"
  # Thinking ON by default (owner decision 2026-10-02; the model's own default): a plain chat request reasons first and
  # answers in `content`; the reasoning arrives in the message's `reasoning` field (vLLM 0.26; `reasoning_content` in
  # older clients). Clients turn it off per request with "chat_template_kwargs": {"enable_thinking": false}. Caveats
  # measured on this port (doc/tti_release/thinking_default_test, RUN_NOTES run 7): in thinking mode the model
  # deliberates at length (give it thousands of tokens of budget; `content` is empty when the budget ends inside the
  # think block) and can repeat itself on constraint-heavy prompts under greedy decoding (also with the bf16 reference
  # weights) - the checkpoint's generation_config (temperature 0.6, top_p 0.95, top_k 20) applies when a request sends no
  # sampling parameters. Every release gate (TTI release, 73 / 73 and 22 / 22 conformance) ran with thinking OFF, i.e.
  # the per-request {"enable_thinking": false} configuration.
  args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}']

# One image serves every profile; a profile is a launch configuration (env + args merged over `serve`). Pick with
# `tt-model serve <bundle> --profile <name>`. Numbers: doc/perf_pass/deployed_sweep.md and doc/HANDOFF.md §1.
serve_profiles:
  - name: p300x2
    description: >
      Interactive default on two p300 boards (4 dies): 32 sequences, 262144 context, text + images, MTP speculative
      decoding at one user (about 66 tok/s on chat text), thinking on. First token 0.32 s at 1 user, 6.3 s for a 32-request burst.
    hardware: p300x2
    mesh_device: P300x2
  - name: p300x2-burst
    description: >
      Many short prompts arriving together (chat front-ends, batch jobs): batched short-prompt prefill ON - first token
      for a 32-request burst 3.8 s instead of 6.3 s (8 users 1.27 s instead of 1.83 s), decode unchanged. Trade-off:
      a request's first token depends slightly on what arrived with it (seeded reproducibility and greedy consistency
      across batch compositions are not guaranteed; 12 / 73 conformance tests fail in that mode).
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_BATCHED_PREFILL: "1"}
  - name: p300x2-longctx
    description: >
      Long prompts mixed with short ones: chunked prefill ON (4096-token scheduler chunks, so one image (up to 4096 tokens) fits a chunk; prefill steps shared between
      prompts so a short prompt no longer waits for a 100K one to finish) with MTP off (the plugin cannot chunk a
      multi-token-per-step model). Single-user decode about 57 tok/s instead of 66; running users still pause during
      prefill steps (the plugin never mixes prefill and decode in one step).
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_CHUNKED_PREFILL: "1", QWEN35_MTP: "0"}
    args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}', --enable-chunked-prefill, [--max-num-batched-tokens, "4096"]]
  - name: p300x2-text
    description: >
      Text only, largest KV pool: the vision tower is not loaded (28472 KV blocks of 64 tokens instead of 22725, i.e.
      1.8 M pooled tokens for the 32 slots) and image requests are rejected at the front end. Otherwise the default.
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_VISION: "0"}
    args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
  # The same four configurations on four p150 boards (the identical (1,4) mesh; kernels compile at launch). Untested on
  # this host (p300x2 only); the p300x2 numbers are the expectation.
  - name: p150x4
    description: Four p150 boards, the interactive default (thinking on, MTP at one user, text + images).
    hardware: p150x4
    mesh_device: P150x4
  - name: p150x4-burst
    description: Four p150 boards, batched short-prompt prefill ON (many short prompts arriving together); see p300x2-burst.
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_BATCHED_PREFILL: "1"}
  - name: p150x4-longctx
    description: Four p150 boards, chunked prefill ON with MTP off (long prompts mixed with short ones); see p300x2-longctx.
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_CHUNKED_PREFILL: "1", QWEN35_MTP: "0"}
    args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}', --enable-chunked-prefill, [--max-num-batched-tokens, "4096"]]
  - name: p150x4-text
    description: Four p150 boards, text only with the largest KV pool (no vision tower); see p300x2-text.
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_VISION: "0"}
    args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
default_profile: p300x2

verify:
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.generator_vllm as g; assert g.Qwen35MoeForConditionalGeneration"
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  description: >
    Qwen3.5-122B-A10B (122B total / 10B active MoE: 256 experts, top-8 + shared expert, 48 layers of Gated DeltaNet + gated attention, vision tower, MTP head) on four Blackhole dies through vLLM and the Tenstorrent plugin, with a fused decode step: the published bundle (raahemnabeel/qwen3-5-122b-a10b) plus fused MoE, Gated DeltaNet, attention, layer-boundary and sampler decode ops for 1-32 concurrent users, ported from the Ornith-1.5-35B-A3B fusion. Same weights, profiles and serving recipe; prefill unchanged.
  quickstart: |
    ### What blackhole-fast changes
    This is [raahemnabeel/qwen3-5-122b-a10b](https://huggingface.co/raahemnabeel/qwen3-5-122b-a10b) with its decode step
    rebuilt around fused kernels, ported from the Ornith-1.5-35B-A3B fusion
    ([raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast](https://huggingface.co/raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast);
    Ornith serves through this model's code). Same checkpoint, same vLLM plugin build, same profiles and serving recipe;
    prefill is unchanged (TTFT equal or lower). The changes:

    1. **Router.** The decode router matmul runs as one 1D matmul, and the 1-token top-8 + softmax + shared-gate sigmoid run
       on the RISC cores in one op instead of a 7-op chain.
    2. **Fused MoE decode.** Routed + shared experts in three ops (route, gate|up + SwiGLU, down) that stream each selected
       expert's weights in place from the existing DRAM layout (no duplicate copy), for every decode width from 1 to 32
       rows, the MTP verify rows included (several users' experts as one union, each weight column read once for all rows).
    3. **Replicated-residual decode boundary.** The decode residual stays replicated on every die: each mixer / MoE output
       is one all-reduce + add + local RMSNorm (two collectives per layer instead of four, no gathers).
    4. **Gated DeltaNet decode mixer** as two programs (causal conv; gates + norms + recurrent state update + gated norm),
       each head's value dimension split across up to four cores.
    5. **Attention decode ops** around the QKV matmul, cache update and SDPA decode (q / k norm + RoPE + gate in one prep op,
       output gating in one post op).
    6. **Fabric layer boundary** (1-4 users): the all-reduce, residual add and RMSNorm as one op over the fabric, with the
       next layer's input projection (or the MoE router) inside the same program.
    7. **Sampler top-k over the live rows only** (1-8 users), instead of all 32 slot rows.

    MTP speculative decoding is off: its verify pass runs the unfused path, and the fused plain decode step is faster
    (1 user on chat text: 132 tok/s, vs 45.9 for the original with MTP).

    Numerics: the routed and shared expert weights are stored rounded to 5 significant bits (what the LoFi expert matmul
    reads), activations / routing weights rounded to the 7 bits the matmul's other operand reads; the fused boundary and
    DeltaNet ops sum in a different order than the op chain they replace. Output quality is checked below.

    ### Use with your client
    Point an OpenAI-compatible client at `http://127.0.0.1:20000` (or the port `tt-model serve` printed) with model
    `Qwen/Qwen3.5-122B-A10B`. Thinking is ON by default: the reasoning arrives in the message's `reasoning` field (vLLM
    0.26; older clients know it as `reasoning_content`) and the answer in `content`. Give thinking requests a large
    `max_tokens` (thousands): when the budget ends inside the think block, `content` is empty. Turn thinking off per
    request with `"chat_template_kwargs": {"enable_thinking": false}` for short, direct answers (the configuration the
    release gates and the published latency numbers were measured in). Without sampling parameters a request uses the
    checkpoint's defaults (temperature 0.6, top_p 0.95, top_k 20); for thinking on constraint-heavy prompts the model
    card's general preset (temperature 1.0, top_p 0.95, top_k 20, presence_penalty 1.5) avoids repetition.
    Tool calls use the `qwen3_xml` parser; images (up to 4 per request, resized to at most 4 MP) as `image_url` parts.

    ### Profiles - which one for which use case
    `tt-model serve raahemnabeel/qwen3-5-122b-a10b-blackhole-fast --profile <name>` (p300x2 names below; the same four exist
    as `p150x4`, `p150x4-burst`, `p150x4-longctx`, `p150x4-text` for four p150 boards):
    - `p300x2` (default) - interactive assistants and agents: one or a few users at a time who want the fastest answer.
      A single user gets about 132 tok/s on chat text; images and tool calls work; thinking on.
    - `p300x2-burst` - many short prompts arriving together (chat front-ends with dozens of users, batch classification,
      extraction jobs): up to four prompts are prefilled per pass, so a 32-request burst gets its first token in 3.8 s
      instead of 6.3 s with the same decode speed. Choose it when throughput matters more than bit-exact reproducibility
      of a request's first token across different batch compositions (seeded runs may differ by what arrived together).
    - `p300x2-longctx` - document and codebase work where very long prompts (tens of thousands of tokens) mix with short
      ones: prefill runs in 4096-token chunks shared between prompts, so a short question is not stuck behind a 100K-token
      upload (about 132 tok/s for a lone user); running users still pause while prefill chunks run.
    - `p300x2-text` - text-only deployments: the vision tower is not loaded, giving a 25 % larger KV pool (1.8 M pooled
      tokens for 32 users) for longer conversations at high occupancy; image requests are rejected at the front end.
  performance: |
    ### Accuracy
    Both bundles evaluated side by side on the same box (p300x2, thinking off, one sample per question, seed 42,
    temperature 0.6 / top_p 0.95 / top_k 20, lm-evaluation-harness through the served API):

    | Eval | published | blackhole-fast |
    | --- | ---: | ---: |
    | GPQA-Diamond (all 198 questions) | 0.697 | 0.697 |
    | IFEval prompt-level strict (100) | 0.85 | 0.88 |
    | LiveCodeBench v6 (50) | 0.54 | 0.54 |

    GPQA-Diamond is identical (138 of 198 both), and the IFEval and LiveCodeBench differences are within one standard
    error (±0.033 over 100 prompts, ±0.071 over 50 problems).

    Layer-level PCC against Hugging Face (real weights, 4 dies, shipped precision policy), published -> fused decode: Gated
    DeltaNet layer 0.99967 -> 0.99965, attention layer 0.99477 -> 0.99471; 32 concurrent users, worst user 0.99717 ->
    0.99719 / 0.99548 -> 0.99532. Prefill is unchanged (identical PCC).

    ### Performance
    Measured on one QuietBox 2 (4 Blackhole p300c dies; published 2026-10-23, blackhole-fast 2026-10-26), both bundles
    served exactly as shipped (`tt-model serve <bundle> --profile p300x2`), one server at a time: random-token prompts of exactly the input length, output
    pinned with ignore_eos, streamed; users are concurrent requests in a closed loop; TTFT = time to first streamed token;
    TPOT = (E2EL - TTFT) / (output - 1); one unrecorded warm-up per row. The published bundle's single-user rows run MTP
    speculative decoding, whose gain depends on how predictable the text is (random-token prompts understate it), so a
    real-text row (12 chat prompts, 384 output tokens, temperature 0) is added; blackhole-fast decodes without MTP. Each cell is `published -> blackhole-fast`.

    | Profile | ISL | OSL | Concurrency | N | TTFT (ms) | Prefill tok/s/u | Decode tok/s/u | E2EL (s) |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | 128 | 128 | 1 | 4 | 216 | 592 | 130.9 | 1.19 |
    | p300x2 | 1024 | 256 | 32 | 128 | 11,953 | 86 | 21.4 | 23.85 |
    | p300x2-longctx | 128 | 128 | 1 | 4 | 212 | 604 | 132.5 | 1.17 |

    #### p300x2

    Latency, batch 1 (single user): published -> blackhole-fast

    | Input tokens | Output tokens | TTFT (ms) | Prefill tok/s | TPOT (ms) | Decode tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 128 | 128 | 305 -> 216 | 420 -> 592 | 30.2 -> 7.6 | 33.1 -> **130.9** (+295 %) | 4.13 -> 1.19 |
    | 1,024 | 256 | 502 -> 418 | 2,038 -> 2,450 | 24.6 -> 7.7 | 40.6 -> **129.9** (+220 %) | 6.76 -> 2.38 |
    | 4,096 | 256 | 1,217 -> 1,096 | 3,365 -> 3,737 | 20.6 -> 7.9 | 48.4 -> **126.9** (+162 %) | 6.48 -> 3.13 |
    | 16,384 | 256 | 4,568 -> 4,400 | 3,586 -> 3,723 | 25.8 -> 8.1 | 38.8 -> **123.5** (+218 %) | 11.13 -> 6.47 |
    | 32,768 | 256 | 9,310 -> 9,039 | 3,520 -> 3,625 | 21.2 -> 8.4 | 47.2 -> **118.5** (+151 %) | 14.71 -> 11.19 |
    | 65,536 | 256 | 19,803 -> 19,142 | 3,309 -> 3,424 | 31.6 -> 9.0 | 31.7 -> **110.8** (+250 %) | 27.85 -> 21.44 |
    | 130,816 | 256 | 44,598 -> 42,978 | 2,933 -> 3,044 | 27.7 -> 10.2 | 36.1 -> **98.4** (+173 %) | 51.67 -> 45.57 |

    Real text, single user (12 chat prompts x 384 output tokens, temperature 0, published with MTP, blackhole-fast without; median per prompt): 45.9 -> **131.8 tok/s** (+187 %).

    Concurrency, 128 input / 128 output tokens: published -> blackhole-fast

    | Users | N | TTFT (ms) | TPOT (ms) | Decode tok/s/user | Total out tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 2 | 8 | 522 -> 496 | 37.0 -> 12.7 | 27.0 -> 78.7 | 49.0 -> **121.2** (+147 %) | 5.22 -> 2.11 |
    | 4 | 16 | 1,035 -> 977 | 44.5 -> 16.6 | 22.5 -> 60.3 | 76.5 -> **166.9** (+118 %) | 6.69 -> 3.09 |
    | 8 | 32 | 1,785 -> 1,701 | 63.7 -> 25.5 | 15.7 -> 39.2 | 103.5 -> **208.6** (+102 %) | 9.90 -> 4.92 |
    | 16 | 64 | 3,321 -> 3,215 | 96.9 -> 35.2 | 10.3 -> 28.4 | 131.6 -> **265.4** (+102 %) | 15.61 -> 7.70 |
    | 32 | 128 | 6,253 -> 6,028 | 113.4 -> 45.1 | 8.8 -> 22.2 | 198.6 -> **347.1** (+75 %) | 20.62 -> 11.79 |

    Concurrency, 1024 input / 256 output tokens: published -> blackhole-fast

    | Users | N | TTFT (ms) | TPOT (ms) | Decode tok/s/user | Total out tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 2 | 8 | 891 -> 861 | 36.2 -> 12.0 | 27.6 -> 83.2 | 50.5 -> **129.8** (+157 %) | 10.13 -> 3.95 |
    | 4 | 16 | 1,771 -> 1,737 | 44.4 -> 16.8 | 22.5 -> 59.4 | 78.2 -> **171.2** (+119 %) | 13.09 -> 6.01 |
    | 8 | 32 | 3,281 -> 3,175 | 63.8 -> 25.2 | 15.7 -> 39.6 | 104.8 -> **214.2** (+104 %) | 19.55 -> 9.56 |
    | 16 | 64 | 6,269 -> 6,134 | 97.6 -> 36.4 | 10.2 -> 27.4 | 131.6 -> **267.7** (+103 %) | 31.13 -> 15.34 |
    | 32 | 128 | 12,215 -> 11,953 | 114.9 -> 46.8 | 8.7 -> 21.4 | 197.3 -> **344.2** (+74 %) | 41.54 -> 23.85 |

    #### p300x2-longctx (MTP off, chunked prefill at 4096 tokens)

    Latency, batch 1 (single user): published -> blackhole-fast

    | Input tokens | Output tokens | TTFT (ms) | Prefill tok/s | TPOT (ms) | Decode tok/s | E2EL (s) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 128 | 128 | 204 -> 212 | 626 -> 604 | 31.3 -> 7.5 | 31.9 -> **132.5** (+315 %) | 4.18 -> 1.17 |
    | 2,048 | 128 | 590 -> 592 | 3,469 -> 3,458 | 31.3 -> 7.7 | 31.9 -> **129.7** (+307 %) | 4.57 -> 1.57 |

    Real text, single user (12 chat prompts x 384 output tokens, temperature 0, MTP off in both; median per prompt): 31.9 -> **131.9 tok/s** (+313 %).
  limitations: |
    - MTP speculative decoding is off: the MTP verify pass still runs the unfused rows path, which is slower than the fused
      plain step. A fused multi-token verify is the way back to MTP.
    - The card rows were measured on the default `p300x2` profile and on `p300x2-longctx` (single-user rows). The `-burst`
      and `-text` profiles run the same decode code (they change prefill batching and the vision tower); the p150x4
      profiles run the same mesh but were not run on p150 boards.
    - The device sampler supports `top_k` up to 32.
    - Benchmark evals ran with thinking off; IFEval and LiveCodeBench on subsets (100 / 50 questions).
    - The published bundle's `-longctx` profiles do not start on this image (vLLM rejects a 2048-token chunk budget below
      one image item's 4096 tokens); this bundle chunks at 4096. The published longctx numbers above were measured with
