# tt-model container (v5.1) manifest for ornith-ai/Ornith-1.5-122B on Blackhole (4 dies). Ornith-1.5-122B has the
# Qwen3.5-122B-A10B architecture (Qwen3_5MoeForConditionalGeneration; config shapes and all 1949 tensor names identical),
# so it is served by this autoport's code exactly as the Qwen3.5-122B-A10B fast bundle (tt-model-fast.yaml, same
# directory): fused MoE / Gated DeltaNet / attention / layer-boundary / sampler decode ops, MTP off. Only the checkpoint
# (HF_MODEL, weights) and the card differ. Package name = the plain model name (image tt-model/ornith-1.5-122b).
schema: "5.1"

repo: raahemnabeel/ornith-1.5-122b
name: ornith-1.5-122b
# weights stay a pointer: the exact HF snapshot every stage of the bring-up validated
weights: {repo: ornith-ai/Ornith-1.5-122B, revision: 7681ef608624e7532d8164128bcffdbdbaf1b1af}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal-q122   # worktree, branch ornith122_fusion
  code:  # the autoport's import closure (checked with a symlinked tree of exactly these paths); the autoport ships its
         # runtime files only (not the per-stage doc/ evidence with profiler CSVs, not tests/)
    - models/autoports/qwen_qwen3_5_122b_a10b/__init__.py
    - models/autoports/qwen_qwen3_5_122b_a10b/tt
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_metadata.json
    - models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/context_contract.json            # read by generator_vllm at build
    - models/autoports/qwen_qwen3_5_122b_a10b/doc/datatype_sweep/selected_precision_config.json   # the shipped precision policy
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # the released sdist built in the image with VLLM_TARGET_DEVICE=empty, installed --no-deps on top of the lock (the
  # wheel form resolves the wheel's own dependency set and would pull torch 2.14 over tt-metal's 2.11.0 pin)
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-pub}   # the plugin build the published image shipped
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json (a copy of the autoport's vllm_metadata.json lives in
  # vllm_bundle/qwen3_5_122b_a10b/; the checkout-based serving uses EXTRA_MODELS_DIR=models/autoports directly)
  extra_models_dir: models/autoports/qwen_qwen3_5_122b_a10b/vllm_bundle
  # resolution overrides: the torch / torchvision tt-metal pins (the ttnn extension is built against 2.11.0) and the
  # transformers this bring-up validated; vLLM 0.26.0 would otherwise resolve torch 2.14 (a full dev-env freeze as a lock
  # dragged unrelated conflicting pins in, so the build resolves live under these overrides and freezes the result)
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 262144
  capabilities:
    tool_parser: qwen3_xml
    reasoning_parser: qwen3
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: ornith-ai/Ornith-1.5-122B
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
    # the fused decode path (ported from the Ornith fusion)
    QWEN35_MOE_FUSED_DECODE: "1"
    QWEN35_DECODE_REPLICATED: "1"
    # Ornith fusion steps 4-5: GDN decode mixer ops + attention decode ops; MTP off (its verify pass keeps the unfused
    # path: plain fused decode is faster, 94 vs 60 tok/s on chat text at 1 user)
    QWEN35_GDN_DECODE_OPS: "1"
    QWEN35_ATTN_DECODE_OPS: "1"
    QWEN35_MTP: "0"
    # step 7 (every profile is 4 dies): fabric layer boundary for 1-4 rows with the next projection / router in its
    # program, sampler top-k over the live rows (62080 columns per die)
    QWEN35_FABRIC_BOUNDARY: "1"
    QWEN35_FB_MAX_ROWS: "4"
    QWEN35_FB_CONSUMER: "1"
    QWEN35_FB_ROUTER: "1"
    QWEN35_ROWS_TOPK: "1"
    # Vision ON: image content parts are served (the checkpoint's ViT on the mesh, bfp8, up to 4 images per request);
    # text requests are unaffected (the tower only runs for image prompts). KV pool in this configuration (MTP head +
    # tower resident): 22725 blocks x 64 tokens = 1.45 M tokens (the stage-13 text-only, no-MTP server had 28472 blocks).
    # Set to "0" for a text-only server.
    QWEN35_VISION: "1"
    QWEN35_VISION_MAX_IMAGES: "4"
    # Served image-resolution cap: 4 MP = 16384 patches = 4096 image tokens per image (the checkpoint's processor default
    # is 16 MP). The tower's programs are keyed by the padded patch count; every bucket up to this cap is warmed at
    # start-up, so no image request compiles a program after the traces are parked (2026-10-01 served image failure).
    QWEN35_VISION_MAX_PIXELS: "4194304"
    # Batched short-prompt prefill: OPT-IN ("1"). Final text prompts <= 512 tokens that arrive together are prefilled
    # up to four per pass (served A/B 2026-10-02: TTFT at 32 users 6.3 -> 3.8 s, at 8 users 1.83 -> 1.27 s, decode
    # unchanged) but the first-token numerics then differ from a single admission (batched GDN form, PCC 0.9995), and
    # the parameter-conformance suite's seeded-reproducibility / greedy-consistency tests across batch compositions
    # failed (12 / 73, bundle run 8). Off keeps 73 / 73; turn on for throughput-first deployments.
    QWEN35_BATCHED_PREFILL: "0"
  # Thinking ON by default (owner decision 2026-10-02; the model's own default): a plain chat request reasons first and
  # answers in `content`; the reasoning arrives in the message's `reasoning` field (vLLM 0.26; `reasoning_content` in
  # older clients). Clients turn it off per request with "chat_template_kwargs": {"enable_thinking": false}. Caveats
  # measured on this port (doc/tti_release/thinking_default_test, RUN_NOTES run 7): in thinking mode the model
  # deliberates at length (give it thousands of tokens of budget; `content` is empty when the budget ends inside the
  # think block) and can repeat itself on constraint-heavy prompts under greedy decoding (also with the bf16 reference
  # weights) - the checkpoint's generation_config (temperature 0.6, top_p 0.95, top_k 20) applies when a request sends no
  # sampling parameters. Every release gate (TTI release, 73 / 73 and 22 / 22 conformance) ran with thinking OFF, i.e.
  # the per-request {"enable_thinking": false} configuration.
  args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}']

# One image serves every profile; a profile is a launch configuration (env + args merged over `serve`). Pick with
# `tt-model serve <bundle> --profile <name>`. Numbers: doc/perf_pass/deployed_sweep.md and doc/HANDOFF.md §1.
serve_profiles:
  - name: p300x2
    description: >
      Interactive default on two p300 boards (4 dies): 32 sequences, 262144 context, text + images, fused decode
      (MTP off), thinking on.
    hardware: p300x2
    mesh_device: P300x2
  - name: p300x2-burst
    description: >
      Many short prompts arriving together (chat front-ends, batch jobs): batched short-prompt prefill ON - first token
      for a 32-request burst 3.8 s instead of 6.3 s (8 users 1.27 s instead of 1.83 s), decode unchanged. Trade-off:
      a request's first token depends slightly on what arrived with it (seeded reproducibility and greedy consistency
      across batch compositions are not guaranteed; 12 / 73 conformance tests fail in that mode).
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_BATCHED_PREFILL: "1"}
  - name: p300x2-longctx
    description: >
      Long prompts mixed with short ones: chunked prefill ON (4096-token scheduler chunks, so one image (up to 4096 tokens) fits a chunk; prefill steps shared between
      prompts so a short prompt no longer waits for a 100K one to finish). Running users still pause during prefill
      steps (the plugin never mixes prefill and decode in one step).
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_CHUNKED_PREFILL: "1", QWEN35_MTP: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}', --enable-chunked-prefill, [--max-num-batched-tokens, "4096"]]
  - name: p300x2-text
    description: >
      Text only, largest KV pool: the vision tower is not loaded (28472 KV blocks of 64 tokens instead of 22725, i.e.
      1.8 M pooled tokens for the 32 slots) and image requests are rejected at the front end. Otherwise the default.
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_VISION: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
  # The same four configurations on four p150 boards (the identical (1,4) mesh; kernels compile at launch). Untested on
  # this host (p300x2 only); the p300x2 numbers are the expectation.
  - name: p150x4
    description: Four p150 boards, the interactive default (thinking on, fused decode, text + images).
    hardware: p150x4
    mesh_device: P150x4
  - name: p150x4-burst
    description: Four p150 boards, batched short-prompt prefill ON (many short prompts arriving together); see p300x2-burst.
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_BATCHED_PREFILL: "1"}
  - name: p150x4-longctx
    description: Four p150 boards, chunked prefill ON (long prompts mixed with short ones); see p300x2-longctx.
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_CHUNKED_PREFILL: "1", QWEN35_MTP: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}', --enable-chunked-prefill, [--max-num-batched-tokens, "4096"]]
  - name: p150x4-text
    description: Four p150 boards, text only with the largest KV pool (no vision tower); see p300x2-text.
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_VISION: "0"}
    args: [--enable-auto-tool-choice, --enable-prefix-caching, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
default_profile: p300x2

verify:
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.generator_vllm as g; assert g.Qwen35MoeForConditionalGeneration"
  - "import models.autoports.qwen_qwen3_5_122b_a10b.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  description: >
    ornith-ai/Ornith-1.5-122B (122B total / 10B active MoE: 256 experts, top-8 + shared expert, 48 layers of Gated DeltaNet + gated attention, vision tower) on four Blackhole dies through vLLM and the Tenstorrent plugin, served by the fused-decode code of the Qwen3.5-122B-A10B Blackhole bundle (same architecture): about 132 tok/s for one user on chat text, 21 tok/s each for 32 concurrent users, 262144-token context, text + images, tool calls, thinking on.
  quickstart: |
    ### What this is
    [ornith-ai/Ornith-1.5-122B](https://huggingface.co/ornith-ai/Ornith-1.5-122B) has the Qwen3.5-122B-A10B architecture
    (`Qwen3_5MoeForConditionalGeneration`: 256 experts top-8 + shared expert, 48 layers of Gated DeltaNet and gated
    attention, vision tower, MTP head; every config shape and all 1949 tensor names match). It is served here by the code
    of the Qwen3.5-122B-A10B Blackhole bundle ([raahemnabeel/qwen3-5-122b-a10b](https://huggingface.co/raahemnabeel/qwen3-5-122b-a10b)),
    unchanged: same fused decode step, same profiles and serving recipe; only the checkpoint differs. The decode step:

    1. **Fused MoE decode.** Router top-8 + softmax + shared-gate in one op; routed + shared experts in three ops that
       stream each selected expert's weights in place, for every decode width from 1 to 32 rows.
    2. **Layer boundary.** The decode residual stays replicated on every die; for 1-4 users the all-reduce, residual add
       and RMSNorm run as one fabric op with the next layer's input projection (or the MoE router) inside its program.
    3. **Gated DeltaNet decode mixer** as two programs (causal conv; gates + norms + recurrent state update + gated norm).
    4. **Attention decode ops** around the QKV matmul, cache update and SDPA decode.
    5. **Sampler top-k over the live rows only** (1-8 users).

    MTP speculative decoding is off: its verify pass runs the unfused path, and the fused plain decode step is faster.

    Numerics: the routed and shared expert weights are stored rounded to 5 significant bits (what the LoFi expert matmul
    reads; bfp4 routed experts as in the Qwen3.5-122B bundle's precision policy), activations / routing weights rounded to
    the 7 bits the matmul's other operand reads. Output quality is checked below.

    ### Use with your client
    Point an OpenAI-compatible client at `http://127.0.0.1:20000` (or the port `tt-model serve` printed) with model
    `ornith-ai/Ornith-1.5-122B`. Thinking is ON by default (the model is a reasoning model): the reasoning arrives in the
    message's `reasoning` field (vLLM 0.26; older clients know it as `reasoning_content`) and the answer in `content`.
    Give thinking requests a large `max_tokens` (thousands): when the budget ends inside the think block, `content` is
    empty. Turn thinking off per request with `"chat_template_kwargs": {"enable_thinking": false}`. Without sampling
    parameters a request uses the checkpoint's defaults (temperature 0.6, top_p 0.95, top_k 20); the model card recommends
    temperature 1.0, top_p 0.95, top_k 20, presence_penalty 1.5 for general tasks and temperature 0.6 for precise coding.
    Tool calls use the `qwen3_xml` parser; images (up to 4 per request, resized to at most 4 MP) as `image_url` parts.

    ### Profiles - which one for which use case
    `tt-model serve raahemnabeel/ornith-1.5-122b --profile <name>` (p300x2 names below; the same four exist as
    `p150x4`, `p150x4-burst`, `p150x4-longctx`, `p150x4-text` for four p150 boards):
    - `p300x2` (default) - interactive assistants and agents: a single user gets about 132 tok/s on chat text; images and
      tool calls work; thinking on.
    - `p300x2-burst` - many short prompts arriving together: up to four prompts are prefilled per pass (faster first token
      for bursts, same decode speed); a request's first token can then depend on what arrived with it.
    - `p300x2-longctx` - very long prompts mixed with short ones: prefill runs in 4096-token chunks shared between prompts
      (about 132 tok/s for a lone user); running users still pause while prefill chunks run.
    - `p300x2-text` - text only: the vision tower is not loaded, giving a larger KV pool; image requests are rejected.
  performance: |
    ### Accuracy
    Evaluated on the served bundle (p300x2, thinking off, one sample per question, seed 42, temperature 0.6 / top_p 0.95 /
    top_k 20, lm-evaluation-harness through the chat API), next to the Qwen3.5-122B-A10B bundle on the same code, box and
    settings:

    | Eval | Ornith-1.5-122B | Qwen3.5-122B-A10B |
    | --- | ---: | ---: |
    | GPQA-Diamond (all 198 questions) | 0.712 ±0.032 | 0.697 |
    | IFEval prompt-level strict (100) | 0.76 ±0.043 | 0.88 |
    | IFEval prompt-level loose (100) | 0.79 ±0.041 | 0.93 |
    | LiveCodeBench v6 (50) | 0.52 ±0.071 | 0.54 |

    The IFEval misses are instruction-following misses in fluent text (exact sentence counts, keyword / letter frequencies,
    all-caps or all-lowercase replies with an added Markdown heading), not corrupted output; the smaller Ornith-1.5-35B-A3B
    scores 0.76-0.82 on the same harness and box. The model card's own benchmarks (agentic coding and tool use) were not
    reproduced here.

    Layer-level PCC against Hugging Face on the Ornith-1.5-122B weights (4 dies, shipped precision policy, fused decode):
    Gated DeltaNet decode 0.99933 (prefill 0.99624), attention decode 0.99406 (prefill 0.99332); 32 concurrent users,
    worst user 0.99717 (DeltaNet) / 0.99530 (attention) - the same as the Qwen3.5-122B-A10B checkpoint on this code
    (0.99965 / 0.99471, worst users 0.99719 / 0.99532). Sampled long-context text (6 samples at temperature 0.6): coherent;
    the probe's 8.9 flagged words per 1k are all real technical terms (quantize, outliers, dimensionality, embeddings).

    ### Performance
    Measured on one QuietBox 2 (4 Blackhole p300c dies), 2026-10-27, the bundle served exactly as shipped
    (`tt-model serve <bundle> --profile <p>`), one server at a time: random-token prompts of exactly the input length,
    output pinned with ignore_eos, streamed; users are concurrent requests in a closed loop; TTFT = time to first streamed
    token; TPOT = (E2EL - TTFT) / (output - 1); one unrecorded warm-up per row; total output tok/s includes prefill. The
    right-hand column is the Qwen3.5-122B-A10B bundle on the same code (2026-10-26) for reference.

    #### p300x2 (default profile)

    Real text, single user (12 chat prompts x 384 output tokens, temperature 0, median per prompt): **131.7 tok/s** (Qwen3.5-122B-A10B on the same code: 131.8).

    Latency, batch 1 (single user)

    | input tokens | TTFT ms | TPOT ms | decode tok/s | Qwen3.5-122B TPOT ms |
    | ---: | ---: | ---: | ---: | ---: |
    | 128 | 230 | 7.51 | 133.1 | 7.64 |
    | 1024 | 446 | 7.69 | 130.1 | 7.70 |
    | 4096 | 1111 | 7.86 | 127.2 | 7.88 |
    | 16384 | 4395 | 8.10 | 123.5 | 8.10 |
    | 32768 | 9075 | 8.42 | 118.8 | 8.44 |
    | 65536 | 19275 | 9.02 | 110.9 | 9.03 |
    | 130816 | 43101 | 10.12 | 98.9 | 10.17 |

    Concurrency, 128 input / 128 output tokens

    | users | TPOT ms | tok/s per user | total output tok/s | TTFT ms | Qwen3.5-122B TPOT ms |
    | ---: | ---: | ---: | ---: | ---: | ---: |
    | 1 | 7.51 | 133.1 | 108.3 | 230 | 7.64 |
    | 2 | 12.63 | 79.2 | 121.1 | 506 | 12.71 |
    | 4 | 16.63 | 60.1 | 164.6 | 1003 | 16.58 |
    | 8 | 24.60 | 40.7 | 211.9 | 1753 | 25.52 |
    | 16 | 36.53 | 27.4 | 260.8 | 3208 | 35.19 |
    | 32 | 46.05 | 21.7 | 342.6 | 6157 | 45.14 |

    Concurrency, 1024 input / 256 output tokens

    | users | TPOT ms | tok/s per user | total output tok/s | TTFT ms | Qwen3.5-122B TPOT ms |
    | ---: | ---: | ---: | ---: | ---: | ---: |
    | 1 | 7.69 | 130.1 | 106.4 | 446 | 7.70 |
    | 2 | 12.19 | 82.1 | 128.8 | 866 | 12.03 |
    | 4 | 16.73 | 59.8 | 171.9 | 1726 | 16.84 |
    | 8 | 26.12 | 38.3 | 210.3 | 3202 | 25.25 |
    | 16 | 36.89 | 27.1 | 264.5 | 6166 | 36.44 |
    | 32 | 47.09 | 21.2 | 343.8 | 12072 | 46.83 |

    #### p300x2-longctx (chunked prefill at 4096 tokens)

    Real text, single user: **131.9 tok/s**.

    | input tokens | TTFT ms | TPOT ms |
    | ---: | ---: | ---: |
    | 128 | 219 | 7.54 |
    | 2048 | 596 | 7.71 |
  limitations: |
    - MTP speculative decoding is off: the MTP verify pass still runs the unfused rows path, which is slower than the fused
      plain step.
    - The card rows were measured on the default `p300x2` profile and on `p300x2-longctx` (single-user rows). The `-burst`
      and `-text` profiles run the same decode code; the p150x4 profiles run the same mesh but were not run on p150 boards.
    - The device sampler supports `top_k` up to 32.
    - Benchmark evals ran with thinking off; IFEval and LiveCodeBench on subsets (100 / 50 questions). The model card's own
      benchmarks (agentic coding and tool use) were not reproduced here.
    - The first start converts the 250 GB bf16 checkpoint and takes about 20 minutes on p300x2; later starts about 14.
  related: >
    Same code, Qwen checkpoint: [raahemnabeel/qwen3-5-122b-a10b](https://huggingface.co/raahemnabeel/qwen3-5-122b-a10b). Smaller sibling: [raahemnabeel/ornith-1.5-35b-a3b](https://huggingface.co/raahemnabeel/ornith-1.5-35b-a3b). Engineering log: `models/autoports/ornith_ai_ornith_1_5_35b_a3b/fusion/HANDOFF.md` on the `ornith122_fusion` branch of github.com/rnabeelTT/tt-metal.
