    | p300x2 | 1024 | 256 | 32 | 128 | 6,182 | 166 | 18.9 | 19.68 |
    | p300 | 128 | 128 | 1 | 4 | 189 | 678 | 117.5 | 1.27 |
    | p300 | 1024 | 256 | 32 | 128 | 7,126 | 144 | 15.3 | 23.89 |

