# tt-model container (v5.1) manifest for Qwen3-Coder-Next "blackhole-fast": the published bundle
# (raahemnabeel/qwen3-coder-next, this directory's tt-model.yaml) plus the fused decode work of the Ornith fusion
# (models/autoports/ornith_ai_ornith_1_5_35b_a3b/fusion/HANDOFF.md):
# - steps 1-3: routed + shared experts in three ops that stream the expert weights in place for every decode width
#   (1..32 rows), and the replicated-residual decode boundary;
# - steps 4-5: the Gated DeltaNet decode mixer (short conv; gates + norms + recurrent state update + gated norm) and the
#   attention decode prep / post ops, as generic_op programs for 1-32 rows;
# - step 7: the fabric layer boundary (all-reduce + residual + RMSNorm as one op, 1-4 rows; four dies) with the next
#   projection / router in its program, the sampler's live-rows top-k (16-bit indices: four dies only), the MoE
#   split-pair gate|up with off-row readers, the GDN head value split.
# Same weights, plugin build and serving recipe; the one fast repo (its earlier revisions stay in the Hub history).
schema: "5.1"

repo: raahemnabeel/qwen3-coder-next-blackhole-fast
name: qwen3-coder-next   # image tt-model/qwen3-coder-next (user, 2026-10-26: no variant suffix on the image)
# weights stay a pointer: the exact HF snapshot every stage of the bring-up validated
weights: {repo: Qwen/Qwen3-Coder-Next, revision: a7fbcb5c0e12d62a448eaa0e260346bf5dcc0feb}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal-codernext   # worktree, branch coder_next_fusion
  code:  # the autoport's import closure (checked with a symlinked tree of exactly these paths); the autoport ships its
         # runtime files only (not the per-stage doc/ evidence with profiler CSVs, not tests/)
    - models/autoports/qwen_qwen3_coder_next/__init__.py
    - models/autoports/qwen_qwen3_coder_next/tt
    - models/autoports/qwen_qwen3_coder_next/vllm_metadata.json
    - models/autoports/qwen_qwen3_coder_next/vllm_bundle
    - models/autoports/qwen_qwen3_coder_next/doc/context_contract.json            # read by generator_vllm at build
    - models/autoports/qwen_qwen3_coder_next/doc/datatype_sweep/selected_precision_config.json       # 4-die policy
    - models/autoports/qwen_qwen3_coder_next/doc/datatype_sweep/selected_precision_config_tp2.json   # 2-die policy
    # machine-readable declaration of what this package serves: capabilities, the precision policy
    # pinned by content hash, the device sampler's top-k ceiling, and the open defects. Same artifact
    # the tt-hous/gpt-oss-120b-p150x4 bundle ships.
    - models/autoports/qwen_qwen3_coder_next/readiness_vllm/vllm_serving_capability.json
    # the long-context sampling defect (fixed): root cause, fix and the evidence trail, referenced by the card
    - models/autoports/qwen_qwen3_coder_next/doc/text_quality/README.md
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # the released sdist built in the image with VLLM_TARGET_DEVICE=empty, installed --no-deps on top of the lock (the
  # wheel form resolves the wheel's own dependency set and would pull torch 2.14 over tt-metal's 2.11.0 pin)
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-pub}   # the plugin build the published image shipped
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json (a copy of the autoport's vllm_metadata.json lives in
  # vllm_bundle/qwen3_coder_next/; the checkout-based serving uses EXTRA_MODELS_DIR=models/autoports directly)
  extra_models_dir: models/autoports/qwen_qwen3_coder_next/vllm_bundle
  # resolution overrides: the torch / torchvision tt-metal pins (the ttnn extension is built against 2.11.0) and the
  # transformers this bring-up validated; vLLM 0.26.0 would otherwise resolve torch 2.14 (a full dev-env freeze as a lock
  # dragged unrelated conflicting pins in, so the build resolves live under these overrides and freezes the result)
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 262144
  capabilities:
    tool_parser: qwen3_coder
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: Qwen/Qwen3-Coder-Next
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
    # Chunked prefill ON in every profile: long prompts are prefilled in 2048-token scheduler chunks (GDN state carried
    # per request), so a short request is not stuck behind a 100K-token prompt. The checkpoint has no MTP head and no
    # vision tower, so nothing competes with it.
    QWEN35_CHUNKED_PREFILL: "1"
    # the fused decode path (ported from the Ornith fusion)
    QWEN35_MOE_FUSED_DECODE: "1"
    QWEN35_DECODE_REPLICATED: "1"
    QWEN35_GDN_DECODE_OPS: "1"      # fused GDN decode mixer (gdn/tp.py checks its preconditions and keeps the op chain otherwise)
    QWEN35_ATTN_DECODE_OPS: "1"     # attention decode prep / post ops (attention/tp.py checks its preconditions likewise)
    QWEN35_ROWS_TOPK: "1"           # sampler top-k over the live rows (<= 8 rows; not installed where a die's vocab slice exceeds 16 bits)
  # The checkpoint's own generation config is served (temperature 1.0 / top_p 0.95 / top_k 40). The
  # greedy override of 2026-10-05 is gone: the long-context word corruption it worked around was the
  # dies of the mesh drawing different tokens from the device sampler (doc/text_quality/README.md),
  # fixed in tt/model.py (_install_lockstep_sampling).
  args: [--enable-auto-tool-choice, --enable-chunked-prefill, [--max-num-batched-tokens, "2048"]]

# One image serves every profile; a profile is a launch configuration (env + args merged over `serve`). Pick with
# `tt-model serve <bundle> --profile <name>`. The mesh size picks the precision policy and the KV budget at build.
serve_profiles:
  - name: p300x2
    description: >
      Two p300 boards (4 dies, TP4): 32 sequences, 262144 context, routed experts in the 4-die precision policy.
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_FABRIC_BOUNDARY: "1", QWEN35_FB_MAX_ROWS: "4", QWEN35_FB_CONSUMER: "1", QWEN35_FB_ROUTER: "1", QWEN35_MOE_SPLIT_PAIR: "1"}   # step 7 (4 dies only: the boundary's persistent L1 receive buffers do not fit the 2-die prefill)
  - name: p150x4
    description: Four p150 boards (4 dies, TP4), same configuration as p300x2. Untested on hardware (built for the identical (1,4) mesh).
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_FABRIC_BOUNDARY: "1", QWEN35_FB_MAX_ROWS: "4", QWEN35_FB_CONSUMER: "1", QWEN35_FB_ROUTER: "1", QWEN35_MOE_SPLIT_PAIR: "1"}   # step 7 (4 dies only: the boundary's persistent L1 receive buffers do not fit the 2-die prefill)
  - name: p300
    description: >
      One p300 board (2 dies, TP2): 32 sequences, 262144 context, bfp4 routed experts (the 4-die policy's experts do not
      fit two dies).
    hardware: p300
    mesh_device: P300
    # the first two chips (on a 4-chip host: the two dies of the first board; fabric init needs every visible chip in
    # the mesh). A no-op on a single p300.
    env: {TT_VISIBLE_DEVICES: "0,1"}
  - name: p150x2
    description: Two p150 boards (2 dies, TP2), same configuration as p300. Untested on hardware (built for the identical (1,2) mesh).
    hardware: p150x2
    mesh_device: P150x2
    env: {TT_VISIBLE_DEVICES: "0,1"}
default_profile: p300x2

verify:
  - "import models.autoports.qwen_qwen3_coder_next.tt.generator_vllm as g; assert g.Qwen3NextForCausalLM and not g.Qwen3NextForCausalLM.supports_multimodal"
  - "import models.autoports.qwen_qwen3_coder_next.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  description: >
    Qwen3-Coder-Next (80B total / 3B active MoE: 512 experts, top-10 + shared expert, 48 layers of Gated DeltaNet + gated attention) on Blackhole through vLLM and the Tenstorrent plugin, with a fused decode step: the published bundle (raahemnabeel/qwen3-coder-next) plus a fused MoE decode for 1-32 concurrent users and a replicated-residual layer boundary, ported from the Ornith-1.5-35B-A3B fusion. Same weights, profiles and serving recipe; prefill unchanged.
  quickstart: |
    ### What blackhole-fast changes
    This is [raahemnabeel/qwen3-coder-next](https://huggingface.co/raahemnabeel/qwen3-coder-next) with its decode step
    rebuilt around fused kernels, ported from the Ornith-1.5-35B-A3B fusion
    ([raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast](https://huggingface.co/raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast)).
    Same checkpoint, same vLLM plugin build, same profiles and serving recipe; prefill is unchanged. The changes:

    1. **Router.** The decode router matmul runs as one 1D matmul, and the 1-token top-10 + softmax + shared-gate sigmoid
       run on the RISC cores in one op instead of the top-k route -> slice -> softmax -> untilize chain.
    2. **Fused MoE decode.** Routed + shared experts in three ops (route, gate|up + SwiGLU, down) that stream each selected
       expert's weights in place from the existing DRAM layout (no duplicate copy), for every decode width from 1 to 32
       rows (several users' experts as one union over the 512 experts, each weight column read once for all rows).
    3. **Replicated-residual decode boundary.** The decode residual stays replicated on every die: each mixer / MoE output
       is one all-reduce + add + local RMSNorm (two collectives per layer instead of four, no gathers).

    Numerics: the routed and shared expert weights are stored rounded to 5 significant bits (what the LoFi expert matmul
    reads), activations / routing weights rounded to the 7 bits the matmul's other operand reads. Output quality is checked
    below.

    ### Use with your client
    Point an OpenAI-compatible client at `http://127.0.0.1:20000` (or the port `tt-model serve` printed) with model
    `Qwen/Qwen3-Coder-Next`. The model does not think (no reasoning block); tool calls use vLLM's `qwen3_coder` parser
    (`--enable-auto-tool-choice` is on). Without sampling parameters a request uses the checkpoint's defaults
    (temperature 1.0, top_p 0.95, top_k 40).

    ### Profiles
    `tt-model serve raahemnabeel/qwen3-coder-next-blackhole-fast --profile <name>`:
    - `p300x2` (default) / `p150x4` - four dies: the faster profile.
    - `p300` / `p150x2` - two dies: the same features on half the hardware, with bfp4 routed experts.

    Every profile: 32 concurrent sequences, 262144-token context, chunked prefill (long prompts do not block short
    requests). The checkpoint has no MTP head and no vision tower.
  performance: |
    ### Accuracy
    Both bundles evaluated side by side on the same box, p300x2, through the served chat API with lm-evaluation-harness
    0.4.9 at temperature 0 (full sets, 8 requests in flight, seed 42):

    | Eval | published | blackhole-fast |
    | --- | ---: | ---: |
    | HumanEval pass@1 (164) | 0.939 | 0.945 |
    | MBPP pass@1 (500) | 0.826 | 0.820 |
    | GSM8K exact match, strict (1319) | 0.954 | 0.955 |
    | IFEval prompt-level strict (541) | 0.799 | 0.782 |
    | IFEval prompt-level loose (541) | 0.841 | 0.826 |

    All differences are within one standard error (IFEval +-0.018, MBPP +-0.017, GSM8K +-0.006): no measurable quality change. The
    harness's stock chat variants do not work through a chat API (`humaneval_instruct` and `mbpp_instruct` pre-fill the
    assistant turn, which the API does not continue: both score 0), so HumanEval uses a chat prompt that asks for the whole
    function in one code block, and MBPP answers are scored from their first code block; `gsm8k_cot_llama` is the stock
    8-shot task with the dataset's current id. The task files are in `fusion/tools/lm_tasks` on the source branch. These
    numbers are not comparable to the published card's (68.9 / 77.2 / 92.4 / 75.8 %), which used the stock tasks at an
    unrecorded configuration; compare the two columns above. Greedy outputs of the p300 profile (bfp4 experts on two dies)
    were checked against the published bundle's.

    ### Performance
    Measured 2026-10-23 on one QuietBox 2 (4 Blackhole p300c dies; p300 rows on two of them), both bundles served exactly
    as shipped (`tt-model serve <bundle> --profile <p>`), one server at a time: random-token prompts of exactly the input
    length, output pinned with ignore_eos, streamed; users are concurrent requests in a closed loop; TTFT = time to first
    streamed token; TPOT = (E2EL - TTFT) / (output - 1); one unrecorded warm-up per row. A real-text single-user row (12 chat
    prompts, 384 output tokens, temperature 0) is added. Each cell is `published -> blackhole-fast`.

    | Profile | ISL | OSL | Concurrency | N | TTFT (ms) | Prefill tok/s/u | Decode tok/s/u | E2EL (s) |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | 128 | 128 | 1 | 4 | 176 | 729 | 70.0 | 1.99 |
    | p300x2 | 1024 | 256 | 32 | 128 | 6,227 | 164 | 14.0 | 24.35 |
    | p300 | 128 | 128 | 1 | 4 | 190 | 674 | 58.3 | 2.37 |
    | p300 | 1024 | 256 | 32 | 128 | 7,129 | 144 | 11.4 | 29.69 |

