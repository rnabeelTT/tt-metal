# tt-model v5.1 container package for Ornith-1.5-35B-A3B on Blackhole.
#
# OPEN BLOCKER: decode is NOT reproducible. At temperature 0 the same prompt returns a
# different completion most runs. A routed expert bank returns a different result from
# bitwise-identical inputs (activation, routing weights AND expert indices all compare
# exactly equal). Affects batch 1, which is what these profiles serve. See
# NONDETERMINISM.md and tools/repro_nondeterminism.py before quoting any accuracy or
# determinism claim from this package.
#
# One package, three serve profiles -- not three packages. mesh_device and the routed
# expert dtype are the only things that differ per board, and v5.1 profiles express
# exactly that, so a consumer picks their board at serve time from one image.
#
#   tt-model package --container tt-model.yaml
#   tt-model serve   build/ornith-1.5-35b-a3b/tt_kernel_manifest.json --profile p300x2
#   tt-model push    build/ornith-1.5-35b-a3b --private
schema: "5.1"
repo: raahemnabeel/ornith-1.5-35b-a3b    # built and verified locally before push
name: ornith-1.5-35b-a3b

# A pointer, pinned. The revision is the one every PCC and accuracy number in this
# bring-up was measured against; leaving it floating would let a consumer serve weights
# nobody validated.
weights:
  repo: ornith-ai/Ornith-1.5-35B-A3B
  revision: 10fbf86fed7ecee4a061f8b499a618f46001cac1

kind: vllm-plugin
arch: blackhole

source:
  tt_metal: /home/raahem/tt-metal
  # An allowlist: exactly what ships. Under-listing fails the image's own build-time
  # import check on this machine rather than at a consumer's first serve.
  #
  #   models/autoports/...      this model
  #   models/demos/blackhole/qwen36   the Qwen3.5 hybrid layer it subclasses
  #   models/experimental/gated_attention_gated_deltanet   the GDN kernels qwen36 calls
  #   models/tt_transformers    ModelArgs, RoPE, CCL, the generator base
  #   models/common             RMSNorm and the shared MoE modules
  #   models/tt_dit             prepare_for_fused_swiglu, pulled in by qwen36's MLP
  #   models/demos/qwen3_vl     imported by qwen36's vision path
  code:
    # The PARENT, because runtime.extra_models_dir points here: the plugin scans this
    # directory's subfolders for vllm_metadata.json, so it has to be inside the image.
    # It holds only this model (308 KB), so nothing extra ships.
    - models/autoports
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tt_dit
  ubuntu: "22.04"     # glibc 2.35: one image runs on both 22.04 and 24.04 hosts
  python: "3.12"      # must match the interpreter the ttnn extension is built against

runtime:
  vllm:
    # Must match what vllm-tt-plugin's docs/install-vllm-tt.sh pins -- the plugin is
    # written against this vLLM's platform-plugin API, and a mismatch fails at import.
    version: "0.26.0"
  plugin:
    path: /home/raahem/vllm-tt-plugin
  # EXTRA_MODELS_DIR is the PARENT of per-model bundle folders, not the bundle itself:
  # the plugin lists subdirectories looking for vllm_metadata.json in each.
  extra_models_dir: models/autoports

# Defaults every profile inherits. max_num_seqs and block_size are required after merge:
# the TT backend rejects vLLM's own defaults.
serve:
  port: 8000
  # 1, and it is a hard limit, not a tuning choice. qwen36 keeps the Gated DeltaNet
  # recurrent state in external buffers on its single-device path and
  # `set_external_state` asserts a batch-1 shape, so a wider batch dies at engine init:
  #   "recurrent_state shape mismatch: [4, 32, 128, 128] != [1, 32, 128, 128]"
  # (measured with --max-num-seqs 4). Only the tensor-parallel path keeps that state in
  # the module and batches, and this model replicates rather than shards.
  #
  # CONCURRENCY COMES FROM LANES, NOT FROM THIS NUMBER. One instance per die, each a
  # complete replica. Launch them with tools/serve_lanes.sh, which pins each lane to a
  # die and supplies the single-die mesh descriptor. Re-measured end to end through
  # vLLM with the current code, one stream per lane, 256-token completions:
  #
  #     lanes (dies)      1        2        4
  #     aggregate     31.66    61.55   109.03 tok/s
  #     per stream    33.15    32.35    28.52 tok/s
  #     TTFT (med)      394      395      410 ms
  #
  # 3.44x at four dies. Two things to read off this. Aggregate is below per-stream x
  # lanes because it is total tokens over wall clock and so carries TTFT; at 128-token
  # completions the same 4 lanes measure 102.10, because a fixed ~400 ms prefill is
  # amortized over half as many tokens. And per-stream decays 33.15 -> 28.52 as
  # lanes are added, which is HOST contention between four vLLM processes, not device
  # contention -- the dies are independent. That decay is proportionally worse than the
  # 25.22 -> 23.71 recorded before this round of optimization, because the device got
  # faster while the host did not.
  #
  # Lanes are the ONLY way extra dies help: decode is dispatch-bound at ~8.4 us per
  # program regardless of tensor size, so tensor parallelism would run the same op
  # count on smaller data and add collectives. See "Why decode costs what it does" in
  # the model README.
  max_num_seqs: 1
  block_size: 64
  additional_config:
    tt:
      # The plugin defaults this to 50 MB; a 40-layer decode trace does not fit
      # ("get_trace_buffers_size() <= trace_region_size").
      trace_region_size: 1073741824
      # NO FABRIC, and THIS is the knob that actually turns it off.
      #
      # The model runs zero collectives: experts are replicated per die, and attention
      # and GDN are replicated too (model_config forces num_devices = 1), so nothing
      # crosses a chip boundary. But the plugin does not know that -- worker.py's
      # get_fabric_config defaults any non-Galaxy MULTI-DEVICE mesh to FABRIC_1D and
      # calls set_fabric before open_mesh_device. Requesting a fabric nothing uses is
      # what broke the p300 profile: a (1,2) mesh on this 4-chip QB2 is a SUBSET of the
      # cluster, its EDM routers never complete their handshake, and engine init dies
      # in fabric_firmware_initializer.cpp.
      #
      # Measured directly on this host, two processes, same device params:
      #   set_fabric_config(FABRIC_1D) then open MeshShape(1,2)
      #     -> "Fabric Router Sync: Timeout after 10000 ms on Device 0.
      #         Expected status 0xa2b2c2d2 (LOCAL_HANDSHAKE_COMPLETE)", throws at
      #        fabric_firmware_initializer.cpp:206/271 -- the container's exact failure
      #   no fabric, open MeshShape(1,2)
      #     -> OPENS, device ids [1, 0]
      #
      # get_fabric_config reads this key by name out of ttnn.FabricConfig.__members__,
      # so DISABLED short-circuits FabricFirmwareInitializer::init and the router-sync
      # wait returns immediately.
      fabric_config: DISABLED
      # NOT set: sample_on_device_mode would be worth ~5 ms/token (dropping the full
      # [1, 1, 248320] logits readback and its sync every step) but the plugin refuses
      # it here:
      #   "on-device sampling requires a certified TP topology (1x4 or 1x8) with at
      #    most 65536 logits/device; got mesh=(1, 1), vocab=248320"
      # The bound is per DIE, so it needs the LM head vocab-sharded: 248320/4 = 62080
      # fits. This model replicates instead (see serve_profiles), so every die holds the
      # whole head. Sharding just the LM head on the 4-die profile would unlock both
      # this and ~1.15 ms of its own compute (540 MB -> 135 MB per die, 1538 -> ~385 us)
      # -- the one place extra dies clearly pay for this model. It needs working
      # collectives for the logit all-gather, which is why it is not done here.
  capabilities:
    # Field names are `reasoning_parser` and `tool_parser` -- ContainerCapabilities sets
    # extra="forbid" specifically so a typo here fails at load rather than shipping a
    # model whose tool calls silently come back as prose.
    reasoning_parser: qwen3       # the model emits <think>...</think> traces
    # NOT hermes. This was `hermes` and TOOL CALLING DID NOT WORK: hermes expects JSON
    # inside <tool_call>, this model emits Qwen XML, so the parser threw
    # JSONDecodeError, returned tools_called=False, and leaked the raw markup into
    # `content` as prose. Caught by actually calling a tool rather than by reading the
    # flag -- the server starts fine either way, which is exactly how it survived this
    # long. What the model emits:
    #   <tool_call>
    #   <function=get_weather>
    #   <parameter=city>
    #   Paris
    #   </parameter>
    #   </function>
    #   </tool_call>
    # Verified against that exact string: hermes -> 0 calls; qwen3_xml -> 1 call,
    # get_weather({"city": "Paris"}). Also checked multi-argument, two-calls-in-one-reply,
    # prose-then-call and no-call-at-all, all correct, and the no-call case leaves
    # `content` untouched. `qwen3_xml` and `qwen3_coder` are ALIASES for the same class
    # (vllm/tool_parsers/__init__.py maps both to Qwen3EngineToolParser); the format name
    # is used here because this model is not the coder variant. Streaming comes from the
    # adapter base (vllm/parser/engine/adapters.py).
    tool_parser: qwen3_xml        # Qwen XML function calls
  # env: intentionally ABSENT, not empty. ContainerManifest types serve.env as a
  # dict, so a comment-only `env:` key parses as None and fails manifest validation
  # with "Input should be a valid dictionary". Leave the key out entirely.
    # There is deliberately no TT_METAL_FABRIC_CONFIG here. That variable DOES NOT
    # EXIST in tt-metal -- a grep over the whole tree finds it only in this file, and it
    # is absent from rtoptions.cpp's env table -- so the entry that used to sit here was
    # a no-op, and the fabric it claimed to disable was never disabled. The fabric is
    # turned off through the plugin's own `fabric_config` key above, which is read by
    # name and takes effect.
    # NOT set here, deliberately: TT_MESH_GRAPH_DESC_PATH is per-LANE, not per-package.
    # To run one instance per die (the throughput deployment -- see serve_profiles),
    # each instance needs BOTH of these, and only then:
    #   TT_VISIBLE_DEVICES=<die>
    #   TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_mesh_graph_descriptor.textproto
    # A single die is a PARTIAL p300 board, so pinning one with TT_VISIBLE_DEVICES alone
    # makes tt-metal classify the QB2 as a CUSTOM cluster and refuse to start ("Custom
    # fabric mesh graph descriptor path must be specified for CUSTOM cluster type");
    # the stock single-chip Blackhole descriptor makes a one-die cluster legal. Setting
    # it package-wide would instead make the WHOLE system look like one chip, which
    # breaks the p300 and p300x2 profiles' own mesh_device.

serve_profiles:
  # THIS IS A SINGLE-CHIP MODEL. Every profile below opens the whole board it names,
  # because tt-model requires mesh_device to match `hardware` ("mesh_device 'P150'
  # opens a 1x1 mesh (1 chips) but hardware 'p300' implies 2"), and all three were run
  # on hardware. But a single instance is a single replica no matter how many dies it
  # opens, so ON A MULTI-DIE BOARD THE HIGHER-THROUGHPUT DEPLOYMENT IS N INSTANCES OF
  # THE p150 PROFILE, one per die -- 109.03 tok/s aggregate on four dies against 28.78
  # for one four-die instance. The per-profile numbers below are per stream.
  #
  # The whole thing is ~18.2 GB (17.1 GB of bfp4 routed experts, which are 92.5% of
  # 34.8B parameters, plus ~1.1 GB of bf8 everything else) against ~30 GB usable per
  # Blackhole die, so one die holds a complete copy.
  #
  # CORRECTION. This comment used to say flatly that "expert parallelism bought no
  # speed", on the grounds that `ttnn.sparse_matmul` in gather mode costs the same 79 us
  # per expert pair whether a die owns 64 experts or 256, since only the routed top-8 are
  # ever visited. That per-expert-pair measurement is real and it is a DECODE
  # measurement, where the cost is dispatch per program and EP indeed buys ~nothing. As a
  # blanket claim about expert parallelism it is WRONG, and this port's own tensor-parallel
  # sweep refutes it on PREFILL, all four dies, the only difference being ORNITH_MOE_EP:
  #
  #     prefill tok/s     ISL 128    ISL 4096    ISL 16384
  #     TP only              366.2       477.5        468.8
  #     TP + EP              574.0      1241.0       1194.9
  #     EP contributes       1.57x       2.60x        2.55x
  #
  # Prefill visits every expert (a 4096-token chunk routes to essentially all 256), so
  # sharding the bank 4 ways really does quarter the work; decode visits 8. That is why
  # ornith-1.0 -- the SAME architecture (dim 2048, 16 q / 2 kv heads, 256 experts top-8,
  # GDN 16/32, 40 layers) -- scales decode 11.59 -> 43.03 tok/s from one die to four with
  # TP=4/EP=4, while this port already decodes 33.15 tok/s on ONE die: its gain comes from
  # no longer reading all 256 experts per layer, which the gather path here never did.
  #
  # Extra dies therefore serve extra USERS. Run `tools/serve_lanes.sh start 4`, or one
  # instance per die by hand (each pinned with
  # TT_VISIBLE_DEVICES; the TT_MESH_GRAPH_DESC_PATH above is what makes a single die a
  # legal cluster on a p300 board) and aggregate throughput scales 3.44x on four dies
  # with per-stream latency flat -- see the table under `max_num_seqs`.
  #
  # All three profiles are otherwise identical and all three were run on hardware. They
  # differ only in `hardware`, which is how tt-model states the device requirement; a
  # p300x2 box should not have to read "p150" and infer that one die is enough.
  #
  # max_model_len is the FULL HF-advertised 262144, and that is now measured rather than
  # assumed. It used to be 4096 -- 1.5% of what the model does -- on the stated grounds
  # that declaring 131072 made the engine fail on a 4.3 GB allocation. That reason did not
  # survive checking: no surviving bring-up log records it, and the arithmetic never
  # supported it. Only 10 of 40 layers hold a KV cache (~20 KB/token), and the GDN
  # recurrent state is context-INDEPENDENT (~30 MB total whatever the length), so the
  # whole 262144-token cache is 5.0 GB at bfloat16 against ~6.5 GB of headroom.
  #
  # Verified two ways on ONE die, both recorded in doc/context_contract.json:
  #   model level  -- 4096 / 16384 / 65536 / 131072 / 262144 each allocate their paged KV
  #                   cache, prefill 2048 tokens and decode, at bfloat16 (the expensive
  #                   option); 262144 uses 4096 blocks / 5.00 GB
  #   serving      -- vLLM at max_model_len=262144 reaches "Application startup complete",
  #                   advertises 262144 on /v1/models and answers a real completion
  #
  # This is the architecture's actual selling point, and the package was discarding it.
  - name: p150
    hardware: p150                # 1 chip -- the unit a lane is made of
    mesh_device: P150             # the one profile measured SERVING end to end
                                  # (stage 11/12: the package answered a real request)
    max_model_len: 262144
    # NOTE: routed_expert_dtype / kv_cache_dtype are deliberately NOT declared here.
    # They were, and they were INERT: the launcher emits the merged additional_config
    # whole, so they landed as TOP-LEVEL vLLM keys while the plugin reads only the "tt"
    # namespace, and nothing in the plugin looks for either name. Expert precision comes
    # from ORNITH_ROUTED_DTYPE or else MESH_PRECISION in tt/model_config.py (bfloat4_b on
    # every mesh); the served KV cache is allocated by the plugin from vLLM's own
    # kv_cache_dtype, which is bfloat16 here. The removed kv_cache_dtype: bfloat8_b was
    # doubly wrong -- inert, and contradicted by what the paged path actually allocates.

  # p300 (a single 2-chip board) IS DELIBERATELY ABSENT, and its removal is a measurement.
  # It cannot serve on this hardware in EITHER configuration:
  #
  #   * WITH a fabric, which tensor parallelism requires for its two collectives per layer:
  #       Fabric Router Sync: Timeout after 10000 ms on Device 0: expected status
  #       0xa2b2c2d2 ... got 0xa0b0c0d0    (fabric_firmware_initializer.cpp:271)
  #     A (1,2) mesh on this 4-chip QB2 is a SUBSET of the cluster, so its EDM routers never
  #     complete the handshake. This is the same failure the fabric_config note above
  #     records, reproduced 2026-09-18 with ORNITH_TP=1 + FABRIC_1D_RING on the profile.
  #
  #   * WITHOUT a fabric, which is the only way a (1,2) mesh opens: the model then
  #     REPLICATES onto two dies, and multi-die replicated decode hangs. Reproduced the
  #     same day -- it opens 2 chips, loads all 40 layers, configures a 262,208-token KV
  #     cache, captures the decode trace, and then never answers a request.
  #
  # So it was never "not yet measured"; it is measured and it does not work here. A profile
  # that hangs is worse than no profile, so it is gone rather than carrying a warning.
  #
  # ON A 2-CHIP BOARD: use p150 (one die) for latency, or two lanes for throughput --
  # 61.55 tok/s aggregate against the ~33 a single replica would give if it worked.
  # tools/serve_lanes.sh start 2
  #
  # CAVEAT, stated because it bounds the claim: both failures are on a 2-chip SUBSET of a
  # 4-chip QB2. A standalone p300 box, where 2 chips ARE the whole cluster, may well
  # handshake its fabric correctly -- no such box was available to test, so this says
  # nothing about one.

  - name: p300x2
    hardware: p300x2              # 2 boards = 4 chips (a QB2)
    mesh_device: P150x4           # MEASURED SERVING 2026-09-18, with full trace capture.
                                  # The old note here said engine init died in the prefill
                                  # warmup; that was the GDN conv1d CB overflow, fixed by
                                  # splitting the depthwise conv into 1024-channel blocks.
                                  #
                                  # THIS PROFILE ALONE IS ONE FOUR-DIE REPLICA, and for a
                                  # single user that is SLOWER to decode than one die.
                                  # Measured, p50 of 3, same method as the p150 row:
                                  #
                                  #            TTFT      decode
                                  #   p150     367.5 ms  32.77 tok/s   <- best decode
                                  #   4-die TP 183.1 ms  30.57 tok/s   <- best TTFT (2.0x)
                                  #
                                  # so it is a LATENCY-SHAPED choice, not a faster one:
                                  # TP wins end to end below ~84 output tokens and loses
                                  # above it. Tensor parallelism costs ~4.6 ms/token in
                                  # collectives and returns ~0.9 ms of compute, because
                                  # this model's decode is launch-bound (24.67 ms device
                                  # model on ONE die; per-layer 583 us GDN / 557 us full).
                                  # For THROUGHPUT on four dies use four lanes instead --
                                  # 109.03 tok/s aggregate against this profile's 30.57.
                                  #
                                  # EVERYTHING IT NEEDS IS WIRED BELOW rather than left to
                                  # the operator. Without these four the profile opens a
                                  # 4-die mesh and then REPLICATES onto it -- one instance
                                  # at ~28.78 tok/s, the worst configuration available on
                                  # this board. Profile `env` and `additional_config`
                                  # deep-merge over the `serve:` defaults, so
                                  # trace_region_size is inherited and fabric_config is
                                  # overridden from DISABLED to the ring.
    max_model_len: 262144
    env:
      # Tensor + expert parallelism. Without it model_config forces num_devices = 1.
      ORNITH_TP: "1"
    additional_config:
      tt:
        # The replicated profiles run zero collectives and disable the fabric; TP runs two
        # per layer and needs the ring, or ccl::get_usable_topology dies on
        # "fabric_context_ != nullptr".
        fabric_config: FABRIC_1D_RING
        # The GDN depthwise conv1d reserves from the L1 small pool.
        l1_small_size: 24576
        # Worth a measured 2.4 ms/token (28.53 -> 30.57 tok/s). It CANNOT live in the
        # top-level additional_config: a (1,1) mesh refuses it, which would break p150.
        sample_on_device_mode: decode_only
    # NOTE: routed_expert_dtype / kv_cache_dtype are deliberately NOT declared here.
    # They were, and they were INERT: the launcher emits the merged additional_config
    # whole, so they landed as TOP-LEVEL vLLM keys while the plugin reads only the "tt"
    # namespace, and nothing in the plugin looks for either name. Expert precision comes
    # from ORNITH_ROUTED_DTYPE or else MESH_PRECISION in tt/model_config.py (bfloat4_b on
    # every mesh); the served KV cache is allocated by the plugin from vLLM's own
    # kv_cache_dtype, which is bfloat16 here. The removed kv_cache_dtype: bfloat8_b was
    # doubly wrong -- inert, and contradicted by what the paged path actually allocates.

# p150 is the default because it has the BEST SINGLE-USER DECODE of the three, which is
# what a default should optimise. Measured, p50 of 3, same harness:
#
#     profile   TTFT        decode
#     p150      365.6 ms    33.13 tok/s   <- default
#     p300x2    184.0 ms    29.65 tok/s   (tensor-parallel; 2.0x TTFT, slower decode)
#
# p300x2 now SERVES -- the note that it "has never answered a request" was true when it was
# written and is not any more -- so the default is a trade-off rather than the only option:
# take p300x2 when time-to-first-token dominates (it wins end to end below ~84 output
# tokens) and p150 otherwise.
#
# The original reason recorded for defaulting to p300x2 was false and stays corrected: "the
# only profile that runs bf16 experts". All three run bfloat4_b routed experts;
# MESH_PRECISION's bf16 entry sits under `routed_ep`, reachable only with ORNITH_MOE_EP=1,
# which nothing in this package sets.
#
# On a multi-die box the higher-THROUGHPUT deployment is neither: it is N instances of the
# p150 profile, one per die, via tools/serve_lanes.sh -- 109.03 tok/s aggregate on four
# dies against 29.65 for a single four-die tensor-parallel instance.
default_profile: p150

# Run inside the finished image, on top of the launcher's own import checks.
#
# Located through importlib, NOT a relative path: `source.code` is staged under `code/`
# in the image, so a host-shaped path like
# "models/autoports/.../vllm_metadata.json" is a FileNotFoundError at build step 21.
# Nothing here touches the weights -- they are a pointer, fetched at pull, so they do
# not exist while the image is building.
verify:
  - |
    # The plugin resolves the model through this metadata file, and a mistake in it
    # fails at a consumer's first serve rather than at build time. Its schema is
    # {"arch": <HFArch>, "main_class": "module:Class"}; a mapping of arch -> class is
    # silently SKIPPED by the plugin's bundle scanner, which is the failure this guards.
    import importlib.util, json, pathlib
    spec = importlib.util.find_spec("models.autoports.ornith_ai_ornith_1_5_35b_a3b")
    md = json.loads(
        (pathlib.Path(spec.origin).parent / "vllm_metadata.json").read_text()
    )
    assert md["arch"] == "Qwen3_5MoeForConditionalGeneration", md
    assert md["main_class"].endswith(":OrnithForConditionalGeneration"), md
  - |
    # The adapter and the model must import cleanly with only what the image ships --
    # this is what catches an under-listed source.code allowlist.
    from models.autoports.ornith_ai_ornith_1_5_35b_a3b.tt.ornith_vllm import (
        OrnithForConditionalGeneration,
    )
    from models.autoports.ornith_ai_ornith_1_5_35b_a3b.tt.model import OrnithModel
    from models.autoports.ornith_ai_ornith_1_5_35b_a3b.tt.model_config import (
        MESH_PRECISION,
    )
    assert set(MESH_PRECISION) == {"P150", "P300", "P150x4"}, MESH_PRECISION

# The generated model card. Only two fields exist (CardSettings sets extra="forbid"):
# `description`, which leads the card under the title, and `quickstart`, which is
# inserted after the generated quickstart block and before "## Serve profiles" -- so
# everything below is H3 to sit under that H2, matching how other tt-model repos
# (e.g. tt-hous/ornith-1.0-35b-p150) lay their cards out.
#
# EVERY NUMBER BELOW IS MEASURED AND SOURCED. The endpoint table is the 12-row
# `vllm bench serve` sweep in doc/tti_release/benchmarks/ (12/12 completed, 0 failed);
# the lane table is tools/serve_bench.py; the container rows are handoff gates. Nothing
# here is projected, and the methodology is stated with each table because the three
# were produced by different harnesses and are NOT interchangeable.
card:
  description: >-
    Ornith-1.5-35B-A3B is a 256-expert mixture-of-experts reasoning model with a hybrid
    Gated DeltaNet / full-attention stack, served through an OpenAI-compatible vLLM
    endpoint on Tenstorrent Blackhole hardware. It holds its full 262,144-token context
    on a single chip.
  quickstart: |
    ### Select a serve profile

    ```bash
    tt-model serve raahemnabeel/ornith-1.5-35b-a3b --profile p150   --follow
    tt-model serve raahemnabeel/ornith-1.5-35b-a3b --profile p300x2 --follow
    ```

    Both profiles enable Qwen3 reasoning and Qwen3 XML tool-call parsing.

    **On a four-die box, use `p300x2` for anything but a short prompt.** It is
    tensor- and expert-parallel and prefills **3.3x faster**, measured through this
    container out to ISL 32768 (see below). `p150` keeps the best single-user DECODE
    (33.09 against 30.57 tok/s), so it remains the default because it is also the only
    profile that runs on one chip -- but the decode edge is 2.5 ms/token and the prefill
    edge is up to 59 SECONDS, so it is not close once the prompt is long.

    An earlier revision of this card said `p300x2` "pays off below roughly 84 output
    tokens and `p150` pays off above it". That crossover was derived at ISL 128 and does
    not generalise -- it scales with the TTFT gap:

    | ISL | p150 TTFT | p300x2 TTFT | TTFT saved | crossover (output tokens) |
    | ---: | ---: | ---: | ---: | ---: |
    | 128 | 368 ms | 183 ms | 184 ms | 74 |
    | 8,192 | 20,688 ms | 6,288 ms | 14.4 s | 5,760 |
    | 16,384 | 41,405 ms | 12,581 ms | 28.8 s | 11,529 |
    | 32,768 | 84,731 ms | 25,339 ms | **59.4 s** | **23,757** |

    **When `content` is null, read `message.reasoning`.** A short `max_tokens` budget can
    be spent entirely inside the `<think>` block, which is a property of the reasoning
    parser rather than a fault; nothing is dropped, and a larger budget returns the
    answer with `finish_reason: stop`. vLLM 0.26.0 has no `reasoning_content` field.

    ### Architecture

    A 256-expert / top-8 MoE with a hybrid attention stack: 30 Gated DeltaNet layers and
    10 gated full-attention layers. Only the full-attention layers hold a KV cache
    (20 KB/token), so 256K context costs 5.0 GB rather than the ~21 GB a dense model of
    this size would need, and the Gated DeltaNet recurrent state is context-independent
    (~30 MB at any length). The whole model is ~18.2 GB — 17.1 GB of that bfp4 routed
    experts, which are 92.5% of 34.8B parameters — so one Blackhole die holds a complete
    copy.

    ### Measured endpoint performance

    Measured with `vllm bench serve` over `/v1/chat/completions` against a server running
    the settings the `p150` profile ships (`max_num_seqs 1`, `block_size 64`,
    `max_model_len 262144`, fabric disabled, host sampling), on **one die** of a
    2x Blackhole p300c host. Concurrency 1, exact input/output lengths, EOS ignored.
    12/12 runs completed, none failed. Decode tokens/s is `1000 / median TPOT`; prefill
    tokens/s is `input tokens / TTFT`.

    **`n` is how many requests that row sampled, and it shrinks as the prompt grows** --
    purely to bound wall-clock, since one 131,072-token request takes 370 s and eight
    would take 50 minutes. It is the sample count, not a model property. Read the last
    three rows with that in mind: at **n = 1 there is no median and no dispersion**, they
    are single observations. Where n > 1 the run-to-run spread is small (TTFT standard
    deviation 6 ms at ISL 128, 107 ms at 2,048, 446 ms at 16,384 -- under 1.1% of TTFT
    throughout).

    #### p150

    | Input tokens | Output tokens | n | TTFT (ms) | Prefill tokens/s | Decode tokens/s | TPOT (ms) |
    | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | 128 | 128 | 8 | 672 | 190 | 32.99 | 30.31 |
    | 128 | 1,024 | 4 | 672 | 190 | 32.61 | 30.67 |
    | 1,024 | 128 | 4 | 4,774 | 215 | 32.73 | 30.56 |
    | 2,048 | 128 | 4 | 5,426 | 378 | 32.75 | 30.53 |
    | 4,096 | 128 | 4 | 10,531 | 389 | 32.55 | 30.72 |
    | 8,192 | 128 | 2 | 20,688 | 396 | 32.27 | 30.98 |
    | 8,192 | 1,024 | 2 | 20,690 | 396 | 32.33 | 30.93 |
    | 10,000 | 1,024 | 2 | 25,491 | 392 | 32.14 | 31.11 |
    | 16,384 | 128 | 2 | 41,405 | 396 | 31.73 | 31.51 |
    | 32,768 | 128 | 1 | 84,731 | 387 | 30.68 | 32.60 |
    | 65,536 | 128 | 1 | 174,855 | 375 | 29.19 | 34.26 |
    | 131,072 | 128 | 1 | 369,740 | 355 | 26.06 | 38.38 |

    **Why TTFT grows so much, and why that is not a contradiction.** TTFT *is* the
    prefill: `TTFT = input tokens / prefill rate`. So a roughly FLAT prefill rate is
    exactly what makes TTFT grow roughly LINEARLY with prompt length -- the two
    statements are the same fact. Per doubling above ISL 2,048, TTFT goes 1.94x, 1.96x,
    2.00x, 2.05x, 2.06x, 2.11x. A 131,072-token prompt costs 370 s of prefill, and no
    reading of the flat rate avoids that; **budget TTFT from the prompt length, always.**

    The mild drift above 2.00x is the O(T^2) term in the 10 full-attention layers
    appearing at long context: prefill rate peaks at 396 tok/s around ISL 8K-16K and
    decays to 355 by 131,072.

    **Below ISL 2,048 the rate is HALF that** -- 190 tok/s at 128 and 215 at 1,024 --
    and this column is an ENDPOINT metric, not the model's prefill compute rate. It is
    `input tokens / TTFT` measured through the whole serving stack, so a short prompt is
    dominated by a fixed cost that has nothing to do with prompt length: HTTP, chat
    templating, tokenisation, scheduling, host-side sampling and detokenisation. Measured
    at the model level instead, ISL 128 prefills in 380 ms (337 tok/s) against this
    table's 672 ms -- so roughly 300 ms of the short-prompt TTFT is serving overhead, and
    **the model's own prefill rate IS roughly flat from ISL 128 (337 tok/s) to 2,048
    (380)**. That distinction is where the discredited "flat across the whole sweep"
    claim came from: flat is true of the model and false of the endpoint.

    Two more short-prompt artefacts: 5.25 ms/token at ISL 128 against 2.53 at 8,192, and
    the 1,024 -> 2,048 step costing only 1.14x rather than 2x, which is the fixed-bucket
    prefill showing through. Treat short-prompt TTFT as a latency floor (~400-670 ms),
    not a throughput measurement.

    **What the 10-of-40 KV ratio does and does not buy.** It is why 256K context is
    affordable in MEMORY (5.0 GB rather than ~21 GB) and why DECODE is nearly
    context-independent -- decode falls only 21% from ISL 128 to 131,072, which for a
    3:1 linear-attention stack is the architecture's real payoff. It does **not** make
    prefill flat: prefill is O(T) work in all 40 layers plus that O(T^2) term in 10 of
    them. An earlier revision of this card claimed prefill held at "~350-370 tok/s across
    the whole sweep, because only 10 of 40 layers carry a KV cache". Both halves were
    wrong -- the range excludes the two fastest rows and both slow short-prompt ones, and
    the causal link does not hold.

    Cross-checked through the packaged container itself, p50 of 3 short requests: TTFT
    **366.7 ms**, decode **33.09 tok/s**, TPOT 30.2 ms — within 0.3% of the ISL-128
    decode above, which is independent evidence the container reproduces these numbers.

    #### p300x2 (tensor + expert parallel, 4 chips) -- THE LONG-PROMPT PROFILE

    Measured through THIS container on a 2x Blackhole p300c host, `/v1/completions` so no
    chat template inflates the token count, `max_tokens=1` so the latency is the prefill.
    The p150 column is the sweep above, so these are endpoint-to-endpoint comparable.

    | Input tokens | p150 TTFT | **p300x2 TTFT** | p300x2 prefill | speedup |
    | ---: | ---: | ---: | ---: | ---: |
    | 8,192 | 20,688 ms | **6,288 ms** | 1,302.9 tok/s | 3.29x |
    | 16,384 | 41,405 ms | **12,581 ms** | 1,302.2 tok/s | 3.29x |
    | 32,768 | 84,731 ms | **25,339 ms** | 1,293.2 tok/s | 3.34x |

    **p300x2's prefill rate is FLAT where p150's decays** -- 1,293-1,303 tok/s across the
    whole range against p150's 396 -> 387 -> falling to 355 by 131,072 -- so the speedup
    GROWS with prompt length. Extrapolating the flat rate, ISL 131,072 is **~101 s against
    p150's measured 370 s (3.7x)**. That last figure is an EXTRAPOLATION: 32,768 is the
    longest length measured on this profile.

    Why it works here when tensor parallelism does nothing for decode: prefill routes a
    chunk to essentially ALL 256 experts while decode visits 8, so sharding the bank four
    ways genuinely quarters the work. The run metadata shows it -- `experts_per_device` is
    64 on this profile against 256 on p150. Tensor parallelism alone is worth only ~1.2x;
    expert parallelism supplies the rest and travels with it automatically.

    Decode is the trade, and it is small: 30.57 tok/s against p150's 33.09 (TPOT 32.7 vs
    30.2 ms), because decode is launch-bound, so TP runs the same op count on smaller data
    and adds ~4.6 ms/token of collectives to recover ~0.9 ms of compute.

    ### Throughput: one instance per die

    `max_num_seqs` is **1**, and it is a hard limit rather than a tuning choice — the
    Gated DeltaNet recurrent state is held in batch-1 external buffers on the
    single-device path. Concurrency therefore comes from running one complete replica per
    die, not from batching. Measured end to end through vLLM with `tools/serve_bench.py`,
    one stream per lane, 256-token completions, all three columns in one pass against one
    set of lanes:

    | | 1 die | 2 dies | 4 dies |
    | --- | ---: | ---: | ---: |
    | aggregate tokens/s | 31.66 | 61.55 | **109.03** |
    | per stream | 33.15 | 32.35 | 28.52 |
    | TTFT median (ms) | 394 | 395 | 410 |

    3.44x on four dies, with per-stream latency nearly flat. Two things to read off it.
    Aggregate is below per-stream x lanes because it is total tokens over wall clock and
    so carries TTFT — at 128-token completions the same lanes give 30.35 / 59.06 / 102.10,
    since a fixed ~400 ms prefill is amortized over half as many tokens, so **always
    quote the completion length with the number**. And per-stream decays 33.15 -> 28.52 as
    lanes are added because four vLLM processes contend for the HOST; the dies are
    independent. Do not read 28.52 as a single-user four-die figure: one user on a
    four-die box runs one lane and gets 33.15.

    ```bash
    tools/serve_lanes.sh start 4      # one replica per die
    ```

    ### Tool calling

    Verified end to end against this container, not inferred from a loaded flag:
    `get_weather({"city": "Paris"})` and `add({"a": 17, "b": 25})` both parse with
    `finish_reason: tool_calls` and no markup leaked into `content`, and a prompt needing
    no tool correctly returns zero calls. Re-run the check yourself:

    ```bash
    tools/verify_tools.sh http://127.0.0.1:20000
    ```

    The parser must be `qwen3_xml`, which this package sets. `hermes` expects JSON inside
    `<tool_call>` while this model emits Qwen XML, so it raises `JSONDecodeError`, reports
    no tool calls and leaks the raw markup into `content` as prose — and the server starts
    cleanly either way, so only a real call detects it.

    ### Committed since this image was built, so NOT in these numbers

    Two measured prefill improvements are in the model source but land only on the next
    package build. The numbers above are this image's, honestly:

    * **MoE prefill chunk 32 -> 64** (`ORNITH_MOE_CHUNK`): +6.5% prefill at ISL 2048,
      +3.0% at 16384, greedy token unchanged. The old value was tuned on expert-union
      compute alone and left out per-iteration overhead.
    * **Dense prefill width buckets** (`QWEN36_PREFILL_BUCKETS=dense`): prefill is priced
      by the padded bucket, so with the old powers-of-two list a 1,030-token prompt paid
      for 2,048 and cost 4,803 ms against 1,000 tokens' 2,558 ms. Every 128-multiple caps
      the waste at 127 tokens: that prompt now costs 2,853 ms, -41%. Only affects prompts
      under 2048; above it the fallback was already 128-aligned. It quadruples warmup
      (73 s -> 300 s), which must be checked against `VLLM_ENGINE_READY_TIMEOUT_S=600`
      before it ships.

    ### Known limitations

    * **Decode is not bit-reproducible.** At temperature 0 the same prompt can return a
      different completion between runs; a routed expert bank returns different results
      from bitwise-identical inputs. See `NONDETERMINISM.md` before quoting any
      determinism or accuracy figure.
    * **`max_num_seqs` is 1.** Batched serving deadlocks; use lanes for concurrency.
    * **On-device sampling is unavailable on `p150`.** The vocabulary is 248,320 against a
      65,536-logits-per-die bound, so the single-chip profile samples on the host.
      `p300x2` enables it for decode.
