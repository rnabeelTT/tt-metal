    ### Limitations
    - The p150x4 and p150x2 profiles run the same meshes as p300x2 / p300 but were not run on p150 boards.
    - One die serves text only, with bfp4 routed experts (book-prompt top-1 0.84 vs 0.89-0.91 on more dies). A gate/up bfp4 +
      down bfp8 policy scores 0.86 / 0.97 / 1.00 but leaves almost no KV pool at 32 sequences (opt-in:
      `QWEN35_PRECISION_CONFIG=.../configs/ornith_routed_gu_bfp4_down_bfp8_mixers_bfp8.json`).
    - The device sampler supports `top_k` up to 32.
