# tt-model container (v5.1) manifest for Ornith-1.5-35B-A3B "blackhole-fast-v3" on Blackhole: blackhole-fast-v2 plus
# fusion/HANDOFF.md step 7 (2026-10-25): the fabric layer boundary (all-reduce + residual + RMSNorm as one op, 1-4 rows),
# the next projection / router inside the boundary's program, the sampler's rows top-k, the MoE split-pair gate|up with
# off-row readers, the GDN head value split. v2 was: blackhole-fast
# (tt-model-fast.yaml, raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast) plus fusion/HANDOFF.md steps 4-6: the Gated
# DeltaNet decode mixer as two generic_op programs (conv; gates + norms + recurrent state update + gated norm), the
# attention decode prep / post ops around the QKV matmul, cache update and SDPA decode, for 1-32 rows; MTP off on the
# multi-die profiles (the MTP verify pass keeps the unfused path: plain fused decode is ~2x faster on real text).
# Same weights, same plugin build; a separate repo so the published bundles stay as they are.
# Authoring interface of `tt-model package --container models/autoports/ornith_ai_ornith_1_5_35b_a3b/tt-model-fast-v3.yaml`.
schema: "5.1"

repo: raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast-v3
name: ornith-1.5-35b-a3b-blackhole-fast-v3
# weights stay a pointer: the exact HF snapshot every check of this port ran against
weights: {repo: ornith-ai/Ornith-1.5-35B-A3B, revision: 10fbf86fed7ecee4a061f8b499a618f46001cac1}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal-bringups
  code:  # the autoport's import closure; runtime files only (not the per-stage doc/ evidence, not tests/)
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/__init__.py
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/tt
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/vllm_metadata.json
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/vllm_bundle
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/doc/context_contract.json                         # read by generator_vllm
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/doc/datatype_sweep/selected_precision_config.json      # 4-die policy
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/doc/datatype_sweep/selected_precision_config_tp2.json  # 2-die policy
    - models/autoports/ornith_ai_ornith_1_5_35b_a3b/doc/datatype_sweep/selected_precision_config_tp1.json  # 1-die policy
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-pub}   # the plugin build the v2 bundle shipped (cacf1e7 + its local changes)
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json; registered first, so this bundle's adapter wins
  # the shared Qwen3_5MoeForConditionalGeneration architecture name
  extra_models_dir: models/autoports/ornith_ai_ornith_1_5_35b_a3b/vllm_bundle
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 262144
  capabilities:
    tool_parser: qwen3_xml        # the model emits Qwen XML tool calls (hermes silently fails on them)
    reasoning_parser: qwen3
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: ornith-ai/Ornith-1.5-35B-A3B
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
    # Vision ON (multi-die profiles): image content parts are served by the checkpoint's ViT on the mesh (bfp8), up to
    # 4 images per request, every padded-patch bucket up to 4 MP warmed at start-up. Verified on 4 dies: 1080p, 12 MP
    # and two-image requests answered in 1.6-3.1 s. Set to "0" for a text-only server.
    QWEN35_VISION: "1"
    QWEN35_VISION_MAX_IMAGES: "4"
    QWEN35_VISION_MAX_PIXELS: "4194304"
    QWEN35_BATCHED_PREFILL: "0"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    # the fused decode path (fusion/HANDOFF.md steps 1-3)
    QWEN35_MOE_FUSED_DECODE: "1"
    QWEN35_DECODE_REPLICATED: "1"
    # steps 4-6: GDN decode mixer ops, attention decode ops (each checks its preconditions, keeps the op chain otherwise)
    QWEN35_GDN_DECODE_OPS: "1"
    QWEN35_ATTN_DECODE_OPS: "1"
    # MTP off: its verify pass runs the unfused rows path; with the fused step plain decode is ~2x faster on real text
    # (4 dies: 169 vs 86 tok/s)
    QWEN35_MTP: "0"
    # step 7: the sampler's per-device top-k over the live rows (decode buckets <= 8 rows; the tie-break pass skipped)
    QWEN35_ROWS_TOPK: "1"
  # Thinking ON by default (the model's own default); turn it off per request with
  # "chat_template_kwargs": {"enable_thinking": false}.
  args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 4, "video": 0}']

# One image serves every profile; a profile is a launch configuration (env + args merged over `serve`). The mesh size
# picks the precision policy and the KV budget at build.
serve_profiles:
  - name: p300x2
    description: Two p300 boards (4 dies, tensor parallel 4), 32 sequences, 262144 context, bfp8 routed experts.
    hardware: p300x2
    mesh_device: P300x2
    env: {QWEN35_FABRIC_BOUNDARY: "1", QWEN35_FB_MAX_ROWS: "4", QWEN35_FB_CONSUMER: "1", QWEN35_FB_ROUTER: "1", QWEN35_MOE_SPLIT_PAIR: "1"}   # step 7 (4 dies only: the boundary's persistent L1 receive buffers do not fit the 2-die prefill)
  - name: p150x4
    description: Four p150 boards (4 dies), same configuration as p300x2. Not run on hardware (the identical (1,4) mesh).
    hardware: p150x4
    mesh_device: P150x4
    env: {QWEN35_FABRIC_BOUNDARY: "1", QWEN35_FB_MAX_ROWS: "4", QWEN35_FB_CONSUMER: "1", QWEN35_FB_ROUTER: "1", QWEN35_MOE_SPLIT_PAIR: "1"}   # step 7 (4 dies only: the boundary's persistent L1 receive buffers do not fit the 2-die prefill)
  - name: p300
    description: One p300 board (2 dies, tensor parallel 2), 32 sequences, 262144 context, bfp8 routed experts.
    hardware: p300
    mesh_device: P300
    env: {TT_VISIBLE_DEVICES: "0,1"}   # the first two chips: fabric init needs every visible chip in the mesh
  - name: p150x2
    description: Two p150 boards (2 dies), same configuration as p300. Not run on hardware (the identical (1,2) mesh).
    hardware: p150x2
    mesh_device: P150x2
    env: {TT_VISIBLE_DEVICES: "0,1"}
  - name: p150
    description: "One p150 (1 die), 32 sequences, bfp4 routed experts (bfp8 does not fit one die), text only, no fabric. One die holds 4 up|gate columns per DRAM bank and expert, which the fused MoE kernels do not read yet: this profile keeps the v2 MoE (with the fused router top-k)."
    hardware: p150
    mesh_device: P150
    additional_config: {tt: {fabric_config: DISABLED}}
    # one die: the blackhole-fast decode path unchanged (the new decode ops have not run on one die), MTP as there
    env: {QWEN35_VISION: "0", QWEN35_GDN_DECODE_OPS: "0", QWEN35_ATTN_DECODE_OPS: "0", QWEN35_MTP: "3"}
    args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
  - name: p100
    description: "One p100 (1 die, 7 DRAM banks): the p150 profile unchanged - 32 sequences, bfp4 routed experts, text only, no fabric. Like p150 it keeps the v2 MoE (7 DRAM banks, 4 columns per bank)."
    hardware: p100
    mesh_device: P150
    additional_config: {tt: {fabric_config: DISABLED}}
    env: {QWEN35_VISION: "0", QWEN35_GDN_DECODE_OPS: "0", QWEN35_ATTN_DECODE_OPS: "0", QWEN35_MTP: "3"}
    args: [--enable-auto-tool-choice, --default-chat-template-kwargs, '{"enable_thinking": true}', --limit-mm-per-prompt, '{"image": 0, "video": 0}']
# Default = the best balance of hardware and performance: two chips keep the 4-chip accuracy (bfp8 routed experts;
# teacher forcing 0.96 / 0.91 top-1 vs 0.97 / 0.89) and vision, at ~80 % of the 4-chip throughput (peak 275 vs 351 tok/s,
# TTFT 4K 0.89 vs 0.72 s) on half the hardware; one chip needs bfp4 experts (book top-1 0.84) and drops vision.
default_profile: p300

verify:
  - "import models.autoports.ornith_ai_ornith_1_5_35b_a3b.tt.generator_vllm as g; assert g.Qwen35MoeForConditionalGeneration"
  - "import models.autoports.ornith_ai_ornith_1_5_35b_a3b.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  description: >
    Ornith-1.5-35B-A3B (35B total / 3B active MoE: 256 experts, top-8 + shared expert, 40 layers of Gated DeltaNet + gated attention, vision tower, MTP head) on Blackhole through vLLM and the Tenstorrent plugin, with a fused decode step: the v2 bundle (raahemnabeel/ornith-1.5-35b-a3b) plus a fused MoE decode for 1-32 concurrent users and a replicated-residual layer boundary. Same weights, profiles and serving recipe; 34-83 % more concurrent output and up to 44 % faster single-user decode on four dies, prefill unchanged.
  quickstart: |
    ### What blackhole-fast changes
    This is [raahemnabeel/ornith-1.5-35b-a3b](https://huggingface.co/raahemnabeel/ornith-1.5-35b-a3b) (v2) with its decode
    step rebuilt around fused kernels. Same checkpoint, same vLLM plugin build, same profiles and serving recipe; prefill is
    unchanged. The changes, in the order they were made (each measured, kept only if it won):

    1. **Router.** The router matmul runs as one 1D matmul (it was a DRAM-sharded matmul on 8 cores), and the top-8 +
       softmax + shared-gate sigmoid run on the RISC cores in one op instead of a 7-op chain (MoE 177 -> 137 us per layer
       on 4 dies).
    2. **Fused MoE decode.** Routed + shared experts in three ops (route, gate|up + SwiGLU, down) that stream each
       selected expert's weights in place from the existing DRAM layout (no duplicate copy), for every decode width: 1 to
       32 rows, the MTP verify rows included (several users' experts as one union, each weight column read once for all
       rows). MoE 137 -> 38 us per layer at 1 user on 4 dies; 2 dies at 16 users 1291 -> 541 us.
    3. **Replicated-residual decode boundary.** The decode residual stays replicated on every die: each mixer / MoE output
       is one all-reduce + add + local RMSNorm (two collectives per layer instead of four, no gathers); boundary 89 -> 52 us
       per layer on 2 dies.

    Numerics: the routed and shared expert weights are stored rounded to 5 significant bits (exactly what the LoFi expert
    matmul reads, so the rounding is no longer a bias), activations / routing weights rounded to the 7 bits the matmul's
    other operand reads. Output quality is checked below.

    On one die (`p150`, `p100`) the full expert width does not fit the fused kernels' bank layout yet, so those profiles keep
    the v2 MoE and gain only the fused router top-k (1-row steps; the 1D router matmul needs a mesh).

    ### Use with your client
    Point an OpenAI-compatible client at `http://127.0.0.1:20000` (or the port `tt-model serve` printed) with model
    `ornith-ai/Ornith-1.5-35B-A3B`. Thinking is ON by default (reasoning in the message's `reasoning` field, answer in
    `content`); turn it off per request with `"chat_template_kwargs": {"enable_thinking": false}`. Give thinking requests a
    large `max_tokens`. Tool calls use the `qwen3_xml` parser. Images (up to 4 per request, resized to at most 4 MP) as
    `image_url` parts on the multi-die profiles.

    ### Profiles
    `tt-model serve raahemnabeel/ornith-1.5-35b-a3b-blackhole-fast --profile <name>`:
    - `p300` (default) / `p150x2` - two dies, bfp8 routed experts, text + images.
    - `p300x2` / `p150x4` - four dies, bfp8 routed experts, text + images: the fastest profile.
    - `p150` / `p100` - one die, bfp4 routed experts, text only (v2 MoE).

    Every profile: 32 concurrent sequences, 262144-token context, MTP speculative decoding while one request is live.
  performance: |
    ### Accuracy
    Benchmark evals through the served API (p300 profile, MTP on, thinking off, one sample per question, seed 42, temperature
    0.6 / top_p 0.95 / top_k 20, lm-evaluation-harness), the same settings as the v2 baseline run on the same box:

    | Eval | v2 (published) | blackhole-fast |
    | --- | ---: | ---: |
    | GPQA-Diamond (40 questions) | 0.775 | 0.85 |
    | IFEval prompt-level strict (100) | 0.76 | 0.77 |
    | LiveCodeBench v6 (50) | 0.36 | 0.40 |

    All within the error bars of these subset sizes (GPQA +-0.06, LiveCodeBench +-0.07): no measurable quality change.
    A long-context garble probe (non-word rate of sampled continuations, 6 runs) scores 7.4-9.0 per 1k words vs 7.2-10.7
    for v2 on the same prompts. Layer-level PCC against Hugging Face (real weights) is unchanged: decode >= 0.9999 at
    1 user, per-user minimum >= 0.9999 at 32 users. Teacher forcing (v2 numbers below) was not re-run.

    Teacher forcing against the Hugging Face bf16 model (v2 numbers; 100 greedy tokens, top-1 / top-5 / top-100):

    | profile | code chat prompt | 2048-token book prompt |
    | --- | --- | --- |
    | 4 dies (bfp8 experts) | 0.97 / 1.00 / 1.00 | 0.89 / 0.98 / 1.00 |
    | 2 dies (bfp8 experts) | 0.96 / 1.00 / 1.00 | 0.91 / 0.97 / 1.00 |
    | 1 die (bfp4 experts) | 0.96 / 1.00 / 1.00 | 0.84 / 0.94 / 0.99 |

    ### Performance
    Measured 2026-10-23 on one QuietBox 2 (4 Blackhole p300c dies; p300 and p150 rows on a subset of it), both bundles
    served exactly as shipped (`tt-model serve <bundle> --profile <p>`), one server at a time, the v2 card's method:
    random-token prompts of exactly the input length, output pinned with ignore_eos, streamed; users are concurrent requests
    in a closed loop; TTFT = time to first streamed token; TPOT = (E2EL - TTFT) / (output - 1); one unrecorded warm-up per
    row. Single-user rows run MTP speculative decoding, whose gain depends on how predictable the text is: random-token
    prompts understate it, so a real-text row (12 chat prompts, 384 output tokens, temperature 0) is added. Each cell is
    `v2 -> blackhole-fast`.

    | Profile | ISL | OSL | Concurrency | N | TTFT (ms) | Prefill tok/s/u | Decode tok/s/u | E2EL (s) |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
