    Note: skipped: 32768 input / 256 output, users 1 (> max_model_len 32768).
    Note: skipped: 65536 input / 256 output, users 1 (> max_model_len 32768).
    Note: skipped: 130816 input / 256 output, users 1 (> max_model_len 32768).

    ### Limitations
    - The p150x4 and p150x2 profiles run the same meshes as p300x2 / p300 but were not run on p150 boards.
    - Two dies: 32768-token context and 8 sequences (weights fill 28.7 of 31.3 GiB per die); no MTP.
    - The device sampler supports `top_k` up to 32.
