# tt-model container (v5.1) manifest for GLM-4.5-Air on Blackhole: 4 dies (p300x2 / p150x4) or 2 dies (p300 / p150x2).
# The Qwen3.5-122B-A10B / Qwen3-Coder-Next / Ornith v2 autoport code adapted to glm4_moe: tensor-parallel GQA attention
# (q/k/v biases, partial RoPE), routed experts sharded on the intermediate dimension with the sigmoid + correction-bias
# router, expert-sorted MoE prefill, on-device sampling, per-width decode traces, MTP speculative decoding from the
# checkpoint's layer-46 MTP head.
# Authoring interface of `tt-model package --container models/autoports/zai_org_glm_4_5_air/tt-model.yaml`.
schema: "5.1"

repo: raahemnabeel/glm-4.5-air-blackhole
name: glm-4.5-air-blackhole
# weights stay a pointer: the exact HF snapshot every check of this port ran against
weights: {repo: zai-org/GLM-4.5-Air, revision: a24ceef6ce4f3536971efe9b778bdaa1bab18daa}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/tt-metal
  code:  # the autoport's import closure; runtime files only (not the per-stage doc/ evidence, not tests/)
    - models/autoports/zai_org_glm_4_5_air/__init__.py
    - models/autoports/zai_org_glm_4_5_air/tt
    - models/autoports/zai_org_glm_4_5_air/vllm_metadata.json
    - models/autoports/zai_org_glm_4_5_air/vllm_bundle
    - models/autoports/zai_org_glm_4_5_air/doc/context_contract.json                         # read by generator_vllm
    - models/autoports/zai_org_glm_4_5_air/doc/datatype_sweep/selected_precision_config.json      # 4-die policy
    - models/autoports/zai_org_glm_4_5_air/doc/datatype_sweep/selected_precision_config_tp2.json  # 2-die policy
    - models/demos/blackhole/qwen36
    - models/demos/qwen3_vl
    - models/experimental/gated_attention_gated_deltanet
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin}
  # the plugin scans the CHILDREN of this dir for vllm_metadata.json (TTGlm4MoeForCausalLM)
  extra_models_dir: models/autoports/zai_org_glm_4_5_air/vllm_bundle
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 131072
  capabilities:
    tool_parser: glm45
    reasoning_parser: glm45
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 805306368
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: zai-org/GLM-4.5-Air
    QWEN35_TRACE_REGION_MIB: "768"   # must match additional_config.tt.trace_region_size (asserted at build)
    QWEN35_PROGRAM_GUARD: "1"
    QWEN35_BATCHED_PREFILL: "0"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  args: [--enable-auto-tool-choice]

serve_profiles:
  - name: p300x2
    description: Two p300 boards (4 dies, tensor parallel 4), 32 sequences, 131072 context.
    hardware: p300x2
    mesh_device: P300x2
  - name: p150x4
    description: Four p150 boards (4 dies), same configuration as p300x2. Not run on hardware (the identical (1,4) mesh).
    hardware: p150x4
    mesh_device: P150x4
  - name: p300
    description: One p300 board (2 dies, tensor parallel 2), bfp4 weights, 8 sequences, 32768 context, no MTP.
    hardware: p300
    mesh_device: P300
    max_num_seqs: 8
    max_model_len: 32768
    additional_config: {tt: {trace_region_size: 536870912}}
    # the 2-die build holds 28.7 GiB of bfp4 weights per die: no MTP head, 512 MiB trace region, 1024-token prefill
    # segments (smaller prefill transients) -> a ~36K-token KV pool shared by 8 sequences
    env: {TT_VISIBLE_DEVICES: "0,1", QWEN35_MTP: "0", QWEN35_TRACE_REGION_MIB: "512", QWEN35_PREFILL_SEGMENT: "1024"}
  - name: p150x2
    description: Two p150 boards (2 dies), same configuration as p300. Not run on hardware (the identical (1,2) mesh).
    hardware: p150x2
    mesh_device: P150x2
    max_num_seqs: 8
    max_model_len: 32768
    additional_config: {tt: {trace_region_size: 536870912}}
    # the 2-die build holds 28.7 GiB of bfp4 weights per die: no MTP head, 512 MiB trace region, 1024-token prefill
    # segments (smaller prefill transients) -> a ~36K-token KV pool shared by 8 sequences
    env: {TT_VISIBLE_DEVICES: "0,1", QWEN35_MTP: "0", QWEN35_TRACE_REGION_MIB: "512", QWEN35_PREFILL_SEGMENT: "1024"}
default_profile: p300x2

verify:
  - "import models.autoports.zai_org_glm_4_5_air.tt.generator_vllm as g; assert g.Glm4MoeForCausalLM"
  - "import models.autoports.zai_org_glm_4_5_air.tt.decode_buckets as b; assert b.widths(32) == [1, 2, 4, 8, 16, 32]"

card:
  description: >
    GLM-4.5-Air (106B total / 12B active MoE: 128 experts top-8 + shared expert, 46 GQA attention layers, MTP layer)
    served on Blackhole through vLLM and the Tenstorrent plugin on four or two dies.
  quickstart: |
    (filled in after the measurements)
