# tt-model container (v5.1) manifest for thinkingmachines/Inkling-2-Mini (26.4B looped MoE, 3.4B active per token, NVFP4 /
# MXFP8 checkpoint) on Blackhole: 4 dies (p300x2 / p150x4), 2 dies (p300 / p150x2) or 1 die (p150), tensor parallel.
# Build: tt-model package --container models/autoports/thinkingmachines_inkling_2_mini/tt-model.yaml
# (source.tt_metal must be a FULL checkout of branch raahem/inkling-2-mini: the image builds tt-metal from it, and the
# expert-sorted prefill needs this branch's moe_sorted_dispatch / moe_gather_rows / moe_gather_add_rows ops.)
schema: "5.1"

repo: raahemnabeel/inkling-2-mini
name: inkling-2-mini
# weights stay a pointer: the exact HF snapshot every check of this port ran against
weights: {repo: thinkingmachines/Inkling-2-Mini, revision: ed40e7da625f594fc9c4990f5f66be24873c22d7}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/inkling2-pkg   # full worktree of raahem/inkling-2-mini (rnabeelTT/tt-metal)
  code:  # the port's import closure; runtime files only (no tests / tools / reference)
    - models/autoports/thinkingmachines_inkling_2_mini/__init__.py
    - models/autoports/thinkingmachines_inkling_2_mini/tt
    - models/autoports/thinkingmachines_inkling_2_mini/hf_config
    - models/autoports/thinkingmachines_inkling_2_mini/vllm_metadata.json
    - models/autoports/thinkingmachines_inkling_2_mini/vllm_bundle
    # shared kernels: the fused MoE decode kernels and the decode top-k sampler (qwen36), the expert-sorted prefill
    # dispatch (the M2.7 port's moe_dispatch), tt_transformers' CCL helpers
    - models/demos/blackhole/qwen36
    - models/autoports/minimaxai_minimax_m2_7/__init__.py
    - models/autoports/minimaxai_minimax_m2_7/tt
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-inkling}   # inkling-mm (d53d9b3): the plugin every serving run of this port used
  extra_models_dir: models/autoports/thinkingmachines_inkling_2_mini/vllm_bundle
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2",
              "numpy==1.26.4"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 65536
  capabilities:
    tool_parser: inkling
    reasoning_parser: inkling
  # vLLM 0.26 / transformers 5.12 do not know the inkling2_loop architecture: the port ships an HF config shim
  # (architecture TTInkling2LoopForConditionalGeneration) and the plugin serves it through the bundle's adapter
  args: [--enable-auto-tool-choice, --trust-remote-code,
         --hf-config-path, /opt/tt-metal/models/autoports/thinkingmachines_inkling_2_mini/hf_config]
  additional_config:
    tt:
      trace_mode: all
      sample_on_device_mode: decode_only
      trace_region_size: 314572800
      l1_small_size: 24576
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: thinkingmachines/Inkling-2-Mini
    TT_METAL_LOGGER_LEVEL: Error
    VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    I2M_EXPERT_DT: bfp8        # routed experts at bfp8 (the checkpoint's NVFP4 / MXFP8 dequantized): quality at the
    I2M_KV_DT: bf16            # fp32-vs-bf16 reference noise floor; bfp8 KV costs measurable KL
    I2M_PREFILL_CHUNK: "1024"  # prefill rows per chunk (the sliding-window rings hold the window + one chunk)
    I2M_PREFILL_PAD: "256"     # a prompt's last chunk padded to a multiple of 256: 4 prefill programs to warm up
    # the dequantized bfp8 expert / attention images (built from the checkpoint on the first boot, ~3.5 min on 2 dies; tt-model's
    # persistent weight cache: later boots load them in about a minute)
    I2M_WCACHE: /weight-cache/wcache_inkling2_mini

serve_profiles:
  - name: p300x2
    description: Two p300 boards (4 dies, tensor parallel 4), 32 sequences sharing a 1.9M-token KV pool, up to 1,048,576
      tokens per request. The fastest profile.
    hardware: p300x2
    mesh_device: P300x2
    max_model_len: 1048576
    env: {I2M_PREFILL_CHUNK: "2048"}   # 2048-row prefill chunks: +14% prefill, the pool 2.06M -> 1.9M tokens
  - name: p150x4
    description: Four p150 boards (4 dies), same configuration as p300x2. Not run on p150 boards (the identical (1,4) mesh).
    hardware: p150x4
    mesh_device: P150x4
    max_model_len: 1048576
    env: {I2M_PREFILL_CHUNK: "2048"}
  - name: p300
    description: One p300 board (2 dies, tensor parallel 2), 16 sequences, 32768-token context.
    hardware: p300
    mesh_device: P300
    max_num_seqs: 16
    max_model_len: 32768
    env: {TT_VISIBLE_DEVICES: "0,1"}   # fabric init needs every visible chip in the mesh
  - name: p150x2
    description: Two p150 boards (2 dies), same configuration as p300. Not run on p150 boards (the identical (1,2) mesh).
    hardware: p150x2
    mesh_device: P150x2
    max_num_seqs: 16
    max_model_len: 32768
    env: {TT_VISIBLE_DEVICES: "0,1"}
  - name: p150
    description: One p150 (1 die), 8 sequences, 8192-token context (the bfp8 experts take 27 of the die's 31.5 GiB).
    hardware: p150
    mesh_device: P150
    max_num_seqs: 8
    max_model_len: 8192
    additional_config: {tt: {fabric_config: DISABLED}}
    env: {I2M_PREFILL_CHUNK: "256", I2M_PREFILL_PAD: "256"}   # the 1024-row rings do not fit beside 8 KV slots
default_profile: p300

verify:
  - "import models.autoports.thinkingmachines_inkling_2_mini.tt.generator_vllm as g; assert g.Inkling2ForCausalLM"
  - "import models.autoports.thinkingmachines_inkling_2_mini.tt.sampling as s; assert s.DeviceTopK"

card:
  description: >
    Inkling-2-Mini (26.4B looped mixture of experts: 24 layers of which 12 run three passes, 3.4B parameters active per
    token; 128 routed experts top-8, sliding-window and global attention with relative position bias, block attention
    residuals, message gates between passes) served on Blackhole through vLLM and the Tenstorrent plugin on four, two or
    one dies: tensor-parallel attention and experts, fused decode kernels for the model's per-layer glue, expert-sorted
    prefill with several requests packed per chunk, prefix caching (vLLM's prefix cache plus snapshots of the
    sliding-window and convolution state), on-device sampling, decode traces for 1-32 users, reasoning and tool calling.
  quickstart: |
    ### Use with your client
    Point an OpenAI-compatible client at `http://127.0.0.1:20000` (or the port `tt-model serve` printed) with model
    `thinkingmachines/Inkling-2-Mini`. Inkling-2-Mini reasons before it answers by default: the reasoning comes back in the
    message's `reasoning` field and the answer in `content`; give reasoning requests a large `max_tokens`, or turn
    reasoning down per request with `"chat_template_kwargs": {"reasoning_effort": "none"}`. Tool calls use the
    `inkling` parser (`tools` in the request -> `tool_calls`, `finish_reason: tool_calls`).

    ### Profiles
    `tt-model serve raahemnabeel/inkling-2-mini --profile <name>`:
    - `p300` (default) / `p150x2` - two dies, 16 sequences, 32,768-token context.
    - `p300x2` / `p150x4` - four dies, 32 sequences, 65,536-token context: the fastest profile.
    - `p150` - one die, 8 sequences, 8,192-token context (the experts take 27 of the die's 31.5 GiB).

    Every profile: routed experts at bfp8 (dequantized from the checkpoint's NVFP4 / MXFP8), bf16 KV cache, on-device
    sampling (top-k up to 32), decode traces for every batch width, prefix caching on: a prompt of 512 tokens or more
    leaves a snapshot at its last 64-token boundary, and a later request that starts with the same tokens (the same
    prompt again, the next turn of a chat, another question about the same document) resumes from it instead of
    prefilling the prefix again (16 snapshots kept on 2 and 4 dies, 1 on one die; least recently used first out).

    ### Accuracy
    Teacher forcing against the Hugging Face model (transformers 5.24, CPU) on 8 held-out texts (chat in three
    languages, code, docs, competitive programming); top-1 agreement / top-1 on confident tokens / KL over the
    reference's top 32:

    | path | top-1 | top-1 (confident) | KL |
    | --- | --- | --- | --- |
    | reference noise floor: fp32 vs bf16 CPU model | 0.975 | 0.998 | 0.010 |
    | prefill (1 die, 8 x 1000 tokens) | 0.970 | 0.997 | 0.014 |
    | decode (1 die, 8 x 736 steps) | 0.967 | 0.997 | 0.019 |
    | prefill (4 dies, 1024-token chunks) | 0.967 | 0.996 | 0.016 |
    | decode (4 dies, 8 x 736 steps) | 0.971 | 0.997 | 0.015 |
    | decode, 32-wide batch (4 dies, 8 x 256 steps) | 0.969 | 0.995 | 0.025 |

    The KL spread between numerically equivalent variants is dominated by one text (code_mbpp, 0.03 - 0.16); on the
    other seven texts the decode KL is 0.002 - 0.012. Long context: a passphrase planted at 10 / 50 / 90 % depth of 17K,
    34K and 63K-token prompts is retrieved on 4 dies. Benchmark evals (GPQA, LiveCodeBench, IFEval) were not run.
  performance: |
    Measured 2026-11-22 on a QuietBox 2 (4 Blackhole p300c dies; the 2- and 1-die rows on a subset of it) through vLLM 0.26
    with the code this package ships, served from the source tree. Random-token prompts of exactly the input length (ISL),
    output pinned with ignore_eos (OSL), greedy, streamed; every request a distinct prompt (no prefix-cache hits);
    `concurrency` users in a closed loop, N requests in all;
    TTFT = time to first streamed token; prefill = ISL / TTFT; decode = 1 / TPOT per user, TPOT = (E2EL - TTFT) /
    (OSL - 1); total = output tokens / wall time.

    | Profile | ISL | OSL | Concurrency | N | TTFT (ms) | Prefill (tok/s) | Decode (tok/s/u) | Total (tok/s) | E2EL (s) |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | 128 | 128 | 1 | 2 | 450 | 284 | 37.1 | 33.0 | 3.87 |
    | p300x2 | 1,024 | 256 | 1 | 2 | 970 | 1,056 | 36.5 | 32.1 | 7.96 |
    | p300x2 | 4,096 | 256 | 1 | 2 | 3,709 | 1,104 | 36.4 | 23.9 | 10.71 |
    | p300x2 | 16,384 | 256 | 1 | 2 | 14,920 | 1,098 | 35.9 | 11.6 | 22.02 |
    | p300x2 | 128 | 128 | 2 | 4 | 689 | 186 | 33.1 | 56.5 | 4.53 |
    | p300x2 | 128 | 128 | 4 | 8 | 1,052 | 122 | 29.5 | 95.6 | 5.36 |
    | p300x2 | 128 | 128 | 8 | 16 | 1,787 | 72 | 24.8 | 148.4 | 6.90 |
    | p300x2 | 128 | 128 | 16 | 32 | 3,212 | 40 | 18.8 | 205.7 | 9.95 |
    | p300x2 | 128 | 128 | 32 | 64 | 6,510 | 20 | 12.0 | 240.1 | 17.06 |
    | p300x2 | 1,024 | 256 | 2 | 4 | 1,462 | 700 | 26.6 | 46.4 | 11.04 |
    | p300x2 | 1,024 | 256 | 4 | 8 | 3,044 | 336 | 28.0 | 84.2 | 12.16 |
    | p300x2 | 1,024 | 256 | 8 | 16 | 6,965 | 147 | 25.9 | 121.7 | 16.82 |
    | p300x2 | 1,024 | 256 | 16 | 32 | 14,714 | 70 | 22.3 | 156.7 | 26.14 |
    | p300x2 | 1,024 | 256 | 32 | 64 | 30,325 | 34 | 13.8 | 167.9 | 48.77 |
    | p300 | 128 | 128 | 1 | 2 | 592 | 216 | 34.0 | 29.6 | 4.33 |
    | p300 | 1,024 | 256 | 1 | 2 | 1,304 | 785 | 33.4 | 28.7 | 8.93 |
    | p300 | 4,096 | 256 | 1 | 2 | 5,157 | 794 | 33.3 | 20.0 | 12.80 |
    | p300 | 16,384 | 256 | 1 | 2 | 21,057 | 778 | 32.7 | 8.9 | 28.85 |
    | p300 | 128 | 128 | 2 | 4 | 898 | 143 | 28.7 | 48.2 | 5.32 |
    | p300 | 128 | 128 | 4 | 8 | 1,321 | 97 | 25.1 | 80.3 | 6.37 |
    | p300 | 128 | 128 | 8 | 16 | 1,941 | 66 | 20.1 | 124.0 | 8.26 |
    | p300 | 128 | 128 | 16 | 32 | 3,869 | 33 | 15.6 | 170.6 | 12.00 |
    | p300 | 1,024 | 256 | 2 | 4 | 1,969 | 520 | 22.2 | 38.0 | 13.47 |
    | p300 | 1,024 | 256 | 4 | 8 | 4,116 | 249 | 25.3 | 72.1 | 14.21 |
    | p300 | 1,024 | 256 | 8 | 16 | 9,372 | 109 | 21.6 | 96.7 | 21.18 |
    | p300 | 1,024 | 256 | 16 | 32 | 19,818 | 52 | 17.4 | 118.7 | 34.50 |
    | p150 | 128 | 128 | 1 | 2 | 814 | 157 | 26.3 | 22.7 | 5.64 |
    | p150 | 1,024 | 256 | 1 | 2 | 3,078 | 333 | 25.9 | 19.8 | 12.93 |
    | p150 | 4,096 | 256 | 1 | 2 | 12,353 | 332 | 25.6 | 11.5 | 22.30 |
    | p150 | 128 | 128 | 2 | 4 | 1,239 | 103 | 20.6 | 34.5 | 7.41 |
    | p150 | 128 | 128 | 4 | 8 | 2,158 | 59 | 17.5 | 54.4 | 9.41 |
    | p150 | 128 | 128 | 8 | 16 | 3,523 | 36 | 13.1 | 77.6 | 13.20 |
    | p150 | 1,024 | 256 | 2 | 4 | 5,410 | 189 | 15.7 | 23.6 | 21.68 |
    | p150 | 1,024 | 256 | 4 | 8 | 10,065 | 102 | 17.5 | 41.6 | 24.62 |
    | p150 | 1,024 | 256 | 8 | 16 | 21,093 | 49 | 13.5 | 51.2 | 40.01 |

    Prefix cache (same server, `tools/prefix_serve.py`, greedy): a 4,438-token prompt (a document plus a question) cold,
    then resent, then the next chat turn on it, then 4 users asking about the same document at once:

    | Profile | Cold TTFT (s) | Resent (s) | Next turn (s) | 4 users, shared document (s each) |
    | --- | ---: | ---: | ---: | ---: |
    | p300x2 | 4.38 | 0.53 | 0.53 | 1.17 |
    | p300 | 6.07 | 0.69 | 0.68 | 1.46 |
    | p150 | 14.10 | 0.96 | 0.96 | 2.07 |
  limitations: |
    - Prefill runs about 1,100 prompt tokens/s on 4 dies, 800 on 2 and 330 on 1. Up to 8 requests share each prefill
      chunk, so short prompts arriving together are prefilled together; long prompts (1K tokens and up) still queue
      behind each other. Prefix caching skips the cached part of a prompt.
    - No speculative decoding (the checkpoint's DSpark drafter is not served yet).
    - The p150x4 and p150x2 profiles run the same meshes as p300x2 / p300 but were not run on p150 boards.
    - Text only. The device sampler supports `top_k` up to 32; logprobs fall back to host sampling.
    - Benchmark evals (GPQA, LiveCodeBench, IFEval) were not run; accuracy is teacher forcing against the reference.
