    | p300x2 | 1,024 | 256 | 1 | 2 | 555 | 1,845 | 120.8 | 96.0 | 2.67 |
    | p300x2 | 4,096 | 256 | 1 | 2 | 2,009 | 2,039 | 204.2 | 78.5 | 3.26 |
