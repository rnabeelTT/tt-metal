    | p150 | 1,024 | 256 | 8 | 16 | 9,547 | 107 | 14.5 | 75.4 | 27.16 |

    Prefix cache (same server, `tools/prefix_serve.py`, greedy): a 4,438-token prompt (a document plus a question) cold,
    then resent, then the next chat turn on it, then 4 users asking about the same document at once:

    | Profile | Cold TTFT (s) | Resent (s) | Next turn (s) | 4 users, shared document (s each) |
    | --- | ---: | ---: | ---: | ---: |
  limitations: |
    - Prefill runs about 3,400 prompt tokens/s on 4 dies, 2,400 on 2 and 750 on 1 (4K-token prompts; long contexts
      slow it: ~1,350 tok/s over a 1M-token prompt on 4 dies). Up to 8 requests share each prefill
      chunk, so short prompts arriving together are prefilled together; long prompts (1K tokens and up) still queue
      behind each other. Prefix caching skips the cached part of a prompt.
    - No speculative decoding (the checkpoint's DSpark drafter is not served yet).
    - The p150x4 and p150x2 profiles run the same meshes as p300x2 / p300 but were not run on p150 boards.
    - Text only. The device sampler supports `top_k` up to 32; logprobs fall back to host sampling.
    - Benchmark evals (GPQA, LiveCodeBench, IFEval) were not run; accuracy is teacher forcing against the reference.
