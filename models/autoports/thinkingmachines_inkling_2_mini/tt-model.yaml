# tt-model container (v5.1) manifest for thinkingmachines/Inkling-2-Mini (26.4B looped MoE, 3.4B active per token, NVFP4 /
# MXFP8 checkpoint) on Blackhole: 4 dies (p300x2 / p150x4), 2 dies (p300 / p150x2) or 1 die (p150), tensor parallel.
# Build: tt-model package --container models/autoports/thinkingmachines_inkling_2_mini/tt-model.yaml
# (source.tt_metal must be a FULL checkout of branch raahem/inkling-2-mini: the image builds tt-metal from it, and the
# expert-sorted prefill needs this branch's moe_sorted_dispatch / moe_gather_rows / moe_gather_add_rows ops.)
schema: "5.1"

repo: raahemnabeel/inkling-2-mini
name: inkling-2-mini
# weights stay a pointer: the exact HF snapshot every check of this port ran against
weights: {repo: thinkingmachines/Inkling-2-Mini, revision: ed40e7da625f594fc9c4990f5f66be24873c22d7}
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/raahem/inkling2-pkg   # full worktree of raahem/inkling-2-mini (rnabeelTT/tt-metal)
  code:  # the port's import closure; runtime files only (no tests / tools / reference)
    - models/autoports/thinkingmachines_inkling_2_mini/__init__.py
    - models/autoports/thinkingmachines_inkling_2_mini/tt
    - models/autoports/thinkingmachines_inkling_2_mini/hf_config
    - models/autoports/thinkingmachines_inkling_2_mini/vllm_metadata.json
    - models/autoports/thinkingmachines_inkling_2_mini/vllm_bundle
    # shared kernels: the fused MoE decode kernels and the decode top-k sampler (qwen36), the expert-sorted prefill
    # dispatch (the M2.7 port's moe_dispatch), tt_transformers' CCL helpers
    - models/demos/blackhole/qwen36
    - models/autoports/minimaxai_minimax_m2_7/__init__.py
    - models/autoports/minimaxai_minimax_m2_7/tt
    - models/tt_transformers
    - models/common
    - models/tttv2_validate_bh_required_capabilities.py
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  plugin: {path: /home/raahem/vllm-tt-plugin-inkling}   # inkling-mm (d53d9b3): the plugin every serving run of this port used
  extra_models_dir: models/autoports/thinkingmachines_inkling_2_mini/vllm_bundle
  overrides: ["torch==2.11.0+cpu", "torchvision==0.26.0+cpu", "transformers==5.12.1", "tokenizers==0.22.2",
              "numpy==1.26.4"]

serve:
  port: 8000
  block_size: 64
  max_num_seqs: 32
  max_model_len: 65536
  capabilities:
    tool_parser: inkling
    reasoning_parser: inkling
  # vLLM 0.26 / transformers 5.12 do not know the inkling2_loop architecture: the port ships an HF config shim
  # (architecture TTInkling2LoopForConditionalGeneration) and the plugin serves it through the bundle's adapter
  args: [--enable-auto-tool-choice, --trust-remote-code,
         --hf-config-path, /opt/tt-metal/models/autoports/thinkingmachines_inkling_2_mini/hf_config]
  additional_config:
    tt:
      trace_mode: all
      sample_on_device_mode: decode_only
      trace_region_size: 314572800
      l1_small_size: 24576
      # the kernel-config ring +I2M_RING_KB (tt/__init__.py): 1461248 - RING_KB * 1024; keep the two in step
      worker_l1_size: &i2m_worker_l1 1428480
      fabric_config: FABRIC_1D
  env:
    ARCH_NAME: blackhole
    HF_MODEL: thinkingmachines/Inkling-2-Mini
    TT_METAL_LOGGER_LEVEL: Error
    # 2 / 4 dies: mesh host -> device writes run on the calling thread. tt-metal's per-device dispatch and reader pool
    # threads are pinned to the same CPU core per die, so each small decode-input write waited 1-5 ms for its pinned
    # worker (caller ~0 CPU). Served TP2 speculative 9.90 -> 9.12 ms/token (pass 24.0 -> 21.1 ms), plain and TTFT
    # unchanged, outputs identical. One die: no pool, no effect.
    TT_MESH_PASS_THROUGH_THREAD_POOL: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    I2M_EXPERT_DT: bfp8        # routed experts at bfp8 (the checkpoint's NVFP4 / MXFP8 dequantized): quality at the
    I2M_KV_DT: bf16            # fp32-vs-bf16 reference noise floor; bfp8 KV costs measurable KL
    I2M_PREFILL_CHUNK: "1024"  # prefill rows per chunk (the sliding-window rings hold the window + one chunk)
    I2M_PREFILL_PAD: "256"     # a prompt's last chunk padded to a multiple of 256: 4 prefill programs to warm up
    # the dequantized bfp8 expert / attention images (built from the checkpoint on the first boot, ~3.5 min on 2 dies; tt-model's
    # persistent weight cache: later boots load them in about a minute)
    I2M_WCACHE: /weight-cache/wcache_inkling2_mini

serve_profiles:
  - name: p300x2
    description: Two p300 boards (4 dies, tensor parallel 4), 32 sequences sharing a 1.7M-token KV pool, up to 1,048,576
      tokens per request. The fastest profile.
    hardware: p300x2
    mesh_device: P300x2
    max_model_len: 1048576
    # the traces take 39 MB of the trace region: 128 MB frees 172 MB per die for the drafter's caches to 64K (+185 MB);
    # the 256 / 512-row prefill traces (I2M_PF_TRACE, on by default on 4 dies) ~19 MB each more
    # the kernel-config ring +64 KB on 2 and 4 dies (tt/__init__.py I2M_RING_KB_TP2): 1461248 - 64 * 1024
    additional_config: {tt: {trace_region_size: 134217728, worker_l1_size: &i2m_worker_l1_mesh 1395712}}
    # 2048-row prefill chunks: +14% prefill; speculative decoding (DSpark drafter, 3 drafts per pass): the pool 2.06M ->
    # 1.7M tokens
    env: {I2M_PREFILL_CHUNK: "2048", I2M_SPEC: "3", I2M_KV_POOL_TOKENS: "1700000", I2M_SPEC_MAX_LEN: "65536"}
  - name: p150x4
    description: Four p150 boards (4 dies), same configuration as p300x2. Not run on p150 boards (the identical (1,4) mesh).
    hardware: p150x4
    mesh_device: P150x4
    max_model_len: 1048576
    additional_config: {tt: {trace_region_size: 134217728, worker_l1_size: *i2m_worker_l1_mesh}}
    env: {I2M_PREFILL_CHUNK: "2048", I2M_SPEC: "3", I2M_KV_POOL_TOKENS: "1700000", I2M_SPEC_MAX_LEN: "65536"}
  - name: p300
    description: One p300 board (2 dies, tensor parallel 2), 16 sequences sharing a 491,520-token context.
    hardware: p300
    mesh_device: P300
    max_num_seqs: 16
    max_model_len: 491520
    # the traces take 33 MB of the trace region: 96 MB frees 204 MB per die for the drafter's caches to 64K (+185 MB);
    additional_config: {tt: {trace_region_size: 100663296, worker_l1_size: *i2m_worker_l1_mesh}}
    # fabric init needs every visible chip in the mesh; speculative decoding: the pool 647K -> 520K tokens
    env: {TT_VISIBLE_DEVICES: "0,1", I2M_SPEC: "3", I2M_KV_POOL_TOKENS: "520000", I2M_SPEC_MAX_LEN: "65536"}
  - name: p150x2
    description: Two p150 boards (2 dies), same configuration as p300. Not run on p150 boards (the identical (1,2) mesh).
    hardware: p150x2
    mesh_device: P150x2
    max_num_seqs: 16
    max_model_len: 491520
    additional_config: {tt: {trace_region_size: 100663296, worker_l1_size: *i2m_worker_l1_mesh}}
    env: {TT_VISIBLE_DEVICES: "0,1", I2M_SPEC: "3", I2M_KV_POOL_TOKENS: "520000", I2M_SPEC_MAX_LEN: "65536"}
  - name: p150
    description: One p150 (1 die), 8 sequences sharing a 32,768-token context, speculative decoding
      at every length (the bfp8 experts take 27 of the die's 31.5 GiB). p150-long has a larger context, text only, without it.
    hardware: p150
    mesh_device: P150
    max_num_seqs: 8
    max_model_len: 32768
    # the traces take 24 MB of the trace region: 64 MB frees 236 MB for the drafter's 32K caches
    additional_config: {tt: {fabric_config: DISABLED, worker_l1_size: *i2m_worker_l1, trace_region_size: 67108864}}
    # 512-row prefill chunks (one pass over the experts per 512 rows), the sliding layers' rings sized for 256 rows (their
    # KV writes + SDPA in 256-row sub-chunks): 1K TTFT 1.47 -> 0.83 s; 1024-row chunks do not fit beside 8 slots.
    # Speculative decoding: the drafter needs ~0.5 GB, the KV pool 57K -> 32K tokens
    # the drafter's caches cover the whole 32K context (+132 MB over 8K; 0.51 GiB free after the captures, was 0.41)
    env: {I2M_PREFILL_CHUNK: "512", I2M_PREFILL_PAD: "256", I2M_RING_CHUNK: "256", I2M_SPEC: "3",
          I2M_KV_POOL_TOKENS: "32768", I2M_SPEC_MAX_LEN: "32768"}
  - name: p150-long
    description: One p150 (1 die), 8 sequences sharing a 57,344-token context, text only, no
      speculative decoding.
    hardware: p150
    mesh_device: P150
    max_num_seqs: 8
    max_model_len: 57344
    # the traces take 19 MB of the trace region: 64 MB frees 236 MB, +8K tokens of KV (0.43 GiB free after the
    # captures, 0.45 at 49K with 300 MB); the drafter does not fit even at 8K
    additional_config: {tt: {fabric_config: DISABLED, worker_l1_size: *i2m_worker_l1, trace_region_size: 67108864}}
    # no vision tower: the prefill's transients need the room
    env: {I2M_PREFILL_CHUNK: "512", I2M_PREFILL_PAD: "256", I2M_RING_CHUNK: "256", I2M_VISION: "0",
          I2M_KV_POOL_TOKENS: "57344"}
default_profile: p300

verify:
  - "import models.autoports.thinkingmachines_inkling_2_mini.tt.generator_vllm as g; assert g.Inkling2ForCausalLM"
  - "import models.autoports.thinkingmachines_inkling_2_mini.tt.sampling as s; assert s.DeviceTopK"

card:
  attribution: >
    Serves [thinkingmachines/Inkling-2-Mini](https://huggingface.co/thinkingmachines/Inkling-2-Mini) by Thinking Machines
    Lab, unmodified, with the checkpoint's own DSpark drafter (mtp.safetensors) for speculative decoding. See the original
    model card for training and evaluation details.
  description: >
    Inkling-2-Mini, a 26.4B-parameter looped mixture-of-experts model (3.4B parameters active per token; 24 layers of
    which 12 run three passes, 128 routed experts top-8, sliding-window and global attention with a relative position
    bias), with image input. Served through vLLM with tensor-parallel attention and experts, speculative decoding with
    the checkpoint's DSpark drafter (3 drafts per pass) for a user decoding alone, prefix caching, on-device sampling,
    reasoning and tool calling.
  intended_use: >
    Chat, coding, reasoning and agent use (tool calls) over text and images (text only on `p150-long`), for up to 32
    (4 dies), 16 (2 dies) or 8 (1 die) concurrent users.
  quickstart: |
    Inkling-2-Mini reasons before it answers by default: give requests a large `max_tokens`, or turn reasoning down per
    request with `"chat_template_kwargs": {"reasoning_effort": "none"}`. The checkpoint's default sampling is
    temperature 1.
  usage: |
    Images go in chat messages as `image_url` content parts (up to 4,095 image tokens per image, one token per 40 x 40
    pixel patch); a larger image is rejected with HTTP 400. `p150-long` is text only.

    Speculative decoding serves a request while it is the only one decoding; with more requests the server decodes
    one token per step for all of them. Drafts are accepted with the standard min(1, p / q) rule, so sampled outputs
    keep the target model's distribution.

    Prefix caching: a prompt of 512 tokens or more leaves a snapshot at its last 64-token boundary, and a later request
    that starts with the same tokens (the same prompt again, the next turn of a chat, another question about the same
    document) resumes from it (16 snapshots kept on 2 and 4 dies, 1 on one die; least recently used first out).

    Every profile: routed experts at bfp8 (dequantized from the checkpoint's NVFP4 / MXFP8), bf16 KV cache.
  performance: |
    Accuracy: teacher forcing against the Hugging Face model (transformers 5.24, CPU) on 8 held-out texts (chat in
    three languages, code, docs, competitive programming); top-1 agreement / top-1 on confident tokens / KL over the
    reference's top 32:

    | path | top-1 | top-1 (confident) | KL |
    | --- | ---: | ---: | ---: |
    | reference noise floor: fp32 vs bf16 CPU model | 0.975 | 0.998 | 0.010 |
    | prefill (1 die, 512-token chunks) | 0.969 | 0.996 | 0.014 |
    | prefill (2 dies, 1024-token chunks) | 0.971 | 0.996 | 0.014 |
    | prefill (4 dies, 2048-token chunks) | 0.969 | 0.996 | 0.012 |
    | decode (1 die, 8 x 736 steps) | 0.966 | 0.996 | 0.014 |
    | decode (2 dies, 8 x 736 steps) | 0.969 | 0.996 | 0.014 |
    | decode (4 dies, 8 x 736 steps) | 0.967 | 0.994 | 0.017 |
    | decode, 32-wide batch (4 dies, 8 x 736 steps) | 0.970 | 0.995 | 0.017 |

    Per text, the decode KL is 0.003 - 0.015 on six texts and 0.03 - 0.07 on code_mbpp. Long context: a passphrase
    planted at 10 / 50 / 90 % depth of 135K, 539K and 1,031K-token prompts is retrieved on 4 dies. Teacher forcing on
    32K and 64K-token documents (two novels, one code repository; positions through the whole document) stays at the
    noise floor: top-1 0.965 - 0.985, KL 0.002 - 0.004, no drift with depth.

    Served evals (p300x2, vLLM, temperature 1, default reasoning effort 0.9, up to 65,536 output tokens; Thinking
    Machines' reported setup is not published, so the scores are not exactly comparable):

    | eval | this server | Thinking Machines' card |
    | --- | ---: | ---: |
    | MMMU-Pro, standard 10 options (600-item random sample) | 72.0% +/- 1.8 | 74.9% |
    | LongBench v2 (200-item random sample, contexts up to 980K tokens, middle-truncated beyond) | 61.0% +/- 3.4 | 66.9% |

    Speed at the checkpoint's default sampling (temperature 1), one user: three held-out texts (math, code, chat) as
    300-token prompts, 256 output tokens, streamed, decode tok/s = 1000 / TPOT, the mean of the three texts (median of 5
    runs each); TTFT on 1,024 / 4,096-token prompts; 8 users x 128 / 128 tokens at once (total output tok/s; the load
    benchmark below):

    | Profile | Decode, temperature 1 (tok/s) | Without speculative decoding, temperature 1 (tok/s) | Decode, greedy (tok/s) | TTFT 1K / 4K (s) | 8 users x 128 tokens (total tok/s) |
    | --- | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | 171.9 | 122.4 | 172.5 | 0.244 / 0.644 | 406.1 |
    | p300 | 130.6 | 96.6 | 127.9 | 0.291 / 1.081 | 285.2 |
    | p150 | 83.2 | 67.0 | 89.3 | 0.525 / 2.035 | 171.8 |
    | p150-long (text only, no speculative decoding) | 67.2 | 67.2 | 67.2 | 0.486 / 1.983 | 169.7 |

    The speculative gain depends on the text (at temperature 1: p300x2 math 207, code 187, chat 123 tok/s; p300 math 159,
    code 138, chat 96; p150 math 101, code 83, chat 66). On chat, where few drafts are accepted, it decodes at about
    the plain rate.

    Load benchmark (`tools/bench_card.py`): random-token prompts of exactly the input length (ISL), output pinned with
    ignore_eos (OSL), greedy, streamed; every request a distinct prompt (no prefix-cache hits); `concurrency` users in
    a closed loop, 2 requests each, run 5 times (N = all requests); TTFT = time to first streamed token (median of the 5
    runs' means, with their range); prefill = ISL / TTFT; decode = 1 / TPOT per user, TPOT = (E2EL - TTFT) / (OSL - 1);
    total = output tokens / wall time (median, range). On random-token prompts the greedy continuation is repetitive and
    drafts unusually well, so the one-user rows overstate what real text decodes at (table above).

    | Profile | ISL | OSL | Concurrency | N | TTFT (ms) | Prefill (tok/s) | Decode (tok/s/u) | Total (tok/s) | E2EL (s) |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
    | p300x2 | 128 | 128 | 1 | 10 | 142 (141-143) | 901 | 122.8 | 108.7 (104.2-143.5) | 1.18 |
    | p300x2 | 1,024 | 256 | 1 | 10 | 244 (239-244) | 4,197 | 159.9 | 139.2 (104.1-215.2) | 1.84 |
    | p300x2 | 4,096 | 256 | 1 | 10 | 644 (643-654) | 6,360 | 259.3 | 157.3 (113.1-162.7) | 1.63 |
    | p300x2 | 128 | 128 | 8 | 80 | 386 (362-401) | 332 | 59.3 | 406.1 (395.6-408.8) | 2.52 |
    | p300x2 | 1,024 | 256 | 8 | 80 | 1,331 (1,321-1,334) | 769 | 65.3 | 391.6 (389.3-395.6) | 5.23 |
    | p300x2 | 128 | 128 | 16 | 160 | 603 (590-616) | 212 | 38.6 | 525.0 (520.3-537.7) | 3.90 |
    | p300x2 | 128 | 128 | 32 | 320 | 1,081 (1,077-1,103) | 118 | 24.4 | 649.1 (640.5-655.1) | 6.31 |
    | p300x2 | 1,024 | 256 | 32 | 320 | 4,924 (4,920-4,943) | 208 | 24.9 | 539.8 (537.1-542.8) | 15.17 |
    | p300 | 128 | 128 | 1 | 10 | 179 (178-188) | 715 | 97.1 | 86.0 (82.7-127.3) | 1.49 |
    | p300 | 1,024 | 256 | 1 | 10 | 291 (290-293) | 3,519 | 175.9 | 147.0 (83.6-159.4) | 1.74 |
    | p300 | 4,096 | 256 | 1 | 10 | 1,081 (1,074-1,082) | 3,789 | 183.8 | 103.7 (78.3-105.3) | 2.47 |
    | p300 | 128 | 128 | 8 | 80 | 431 (391-432) | 297 | 40.2 | 285.2 (278.4-286.3) | 3.59 |
    | p300 | 1,024 | 256 | 8 | 80 | 2,046 (2,043-2,048) | 500 | 45.8 | 268.9 (263.6-275.8) | 7.61 |
    | p300 | 128 | 128 | 16 | 160 | 705 (687-713) | 182 | 26.6 | 374.0 (368.4-383.9) | 5.47 |
    | p300 | 1,024 | 256 | 16 | 160 | 4,082 (4,081-4,085) | 251 | 30.7 | 330.6 (320.5-337.9) | 12.39 |
    | p150 | 128 | 128 | 1 | 10 | 220 (217-221) | 582 | 64.1 | 58.1 (57.0-72.6) | 2.20 |
    | p150 | 1,024 | 256 | 1 | 10 | 525 (524-529) | 1,950 | 115.4 | 93.7 (70.9-104.9) | 2.73 |
    | p150 | 4,096 | 256 | 1 | 10 | 2,035 (2,033-2,037) | 2,013 | 111.6 | 59.3 (49.2-63.5) | 4.32 |
    | p150 | 128 | 128 | 8 | 80 | 668 (667-697) | 192 | 24.0 | 171.8 (158.2-178.2) | 5.96 |
    | p150 | 1,024 | 256 | 8 | 80 | 3,840 (3,839-3,852) | 267 | 28.2 | 159.0 (156.5-167.1) | 12.88 |
    | p150-long | 128 | 128 | 1 | 10 | 189 (186-191) | 677 | 68.4 | 62.6 (62.5-62.6) | 2.05 |
    | p150-long | 1,024 | 256 | 1 | 10 | 486 (482-489) | 2,107 | 64.2 | 57.4 (57.3-57.4) | 4.46 |
    | p150-long | 4,096 | 256 | 1 | 10 | 1,983 (1,978-1,985) | 2,066 | 62.8 | 42.4 (42.3-42.4) | 6.04 |
    | p150-long | 128 | 128 | 8 | 80 | 696 (667-699) | 184 | 23.7 | 169.7 (163.8-187.0) | 6.03 |
    | p150-long | 1,024 | 256 | 8 | 80 | 3,846 (3,840-3,852) | 266 | 27.8 | 157.4 (150.5-162.6) | 13.01 |

    Prefix cache (`tools/prefix_serve.py`, greedy): a 4,438-token prompt (a document plus a question)
    cold, then resent, then the next chat turn on it, then 4 users asking about the same document at once (TTFT, s):

    | Profile | Cold | Resent | Next turn | 4 users, shared document (mean) |
    | --- | ---: | ---: | ---: | ---: |
    | p300x2 | 0.84 | 0.17 | 0.19 | 0.34 |
    | p300 | 1.37 | 0.22 | 0.24 | 0.39 |
    | p150 | 2.57 | 0.28 | 0.30 | 0.47 |
    | p150-long | 2.53 | 0.25 | 0.27 | 0.47 |

    Measured 2026-11-28 on one QuietBox 2 (4 Blackhole p300c dies; the 2- and 1-die profiles on a subset of it) through
    vLLM 0.26 with this package's image and each profile's own settings.
  limitations: |
    - Prefill runs about 6,400 prompt tokens/s on 4 dies, 3,800 on 2 and 2,000 on 1 (4K-token prompts). Up to 8 requests share each prefill chunk; long prompts (1K tokens and up) queue behind each other.
    - Speculative decoding applies only while one request is decoding and its sequence is under 65,536 tokens (32,768 on
      `p150`; not on `p150-long`); with several users, or past that length, every request decodes one token per step.
    - A profile's sequences share its KV cache (1.7M tokens on 4 dies; the context on 2 and 1 die): one request may use
      the whole context, and requests that do not fit beside the running ones wait.
    - Sampling at temperature > 0 draws from the 32 most likely tokens; top_k above 32 acts as 32. Requests with
      penalties or top_p < 1, and logprobs, are sampled on the host (slower).
    - No video or audio input; no image input on `p150-long`. One image may take up to 4,095 image tokens.
    - The p150x4 and p150x2 profiles run the same meshes as p300x2 / p300 but were not run on p150 boards.
    - Outputs are close to but not identical to the bf16 reference (bfp8 experts; see the accuracy table). Benchmark
      evals (GPQA, LiveCodeBench, IFEval) were not run.
    - Not for decisions where an unreviewed wrong answer causes harm (medical, legal, financial or safety-critical
      use); like the original model, it can state wrong facts with confidence.
